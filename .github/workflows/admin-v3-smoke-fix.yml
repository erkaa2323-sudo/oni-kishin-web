name: Admin V3 Smoke Fix

on:
  push:
    branches:
      - gpt6/admin-v3-control-center

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gpt6/admin-v3-control-center

      - name: Preserve signed-out admin smoke contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/oni/OniAdminGate.tsx')
          text = path.read_text()
          old = '          Нэвтрэх\n        </button>'
          new = '          НЭВТРЭХ\n        </button>'
          if old not in text:
              raise SystemExit('sign-in button contract not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit smoke fix
        run: |
          if git diff --quiet; then
            echo "Smoke contract already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/oni/OniAdminGate.tsx
          git commit -m "fix(admin): preserve sign-in smoke label"
          git push origin HEAD:gpt6/admin-v3-control-center
