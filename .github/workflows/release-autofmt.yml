name: Temporary Final Release Autofmt

on:
  push:
    branches:
      - final/release-2026-09-08

permissions:
  contents: write

concurrency:
  group: temporary-final-release-autofmt
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip autofmt]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: final/release-2026-09-08

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install verified dependencies
        run: |
          npm install --global npm@11.9.0
          npm ci --no-audit --no-fund

      - name: Format only release integration files
        run: |
          npx --no-install prettier --write \
            scripts/economy-emulator-log-audit.mjs \
            scripts/economy-rule-coverage-report.mjs \
            scripts/economy-rules-test.mjs \
            scripts/economy-v3-ternary-patch.mjs \
            src/components/oni/OniCosmeticBridge.tsx \
            src/components/oni/OniEconomyAdminDock.tsx \
            src/components/oni/OniProgressionStage.tsx \
            src/data/creator-publish.ts \
            src/data/economy-admin.ts \
            src/data/progression.ts \
            src/lib/progression-rewards.ts

      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/economy-emulator-log-audit.mjs \
            scripts/economy-rule-coverage-report.mjs \
            scripts/economy-rules-test.mjs \
            scripts/economy-v3-ternary-patch.mjs \
            src/components/oni/OniCosmeticBridge.tsx \
            src/components/oni/OniEconomyAdminDock.tsx \
            src/components/oni/OniProgressionStage.tsx \
            src/data/creator-publish.ts \
            src/data/economy-admin.ts \
            src/data/progression.ts \
            src/lib/progression-rewards.ts
          git commit -m "style: format final release [skip autofmt]"
          git push origin HEAD:final/release-2026-09-08
