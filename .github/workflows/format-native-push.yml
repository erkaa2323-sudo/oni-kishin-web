name: Format Native Push

on:
  push:
    branches:
      - gpt6/native-push

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt6/native-push
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: >-
          npx --no-install prettier --write
          src/components/oni/OniNativeNotificationBridge.tsx
          src/lib/native-notifications.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/oni/OniNativeNotificationBridge.tsx src/lib/native-notifications.ts
          git commit -m "style(push): apply prettier"
          git push
