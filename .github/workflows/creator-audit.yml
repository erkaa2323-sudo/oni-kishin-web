name: Creator Audit

on:
  push:
    branches: [main]
    paths:
      - src/components/oni/OniCreatorStudio.tsx
      - src/components/oni/OniCreatorReviewDock.tsx
      - src/components/oni/OniAdminPage.tsx
      - src/data/creator-publish.ts
      - src/data/gallery.ts
      - src/lib/oni-creator.functions.ts
      - .github/workflows/creator-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --no-save
      - name: Creator strict type audit
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E 'src/(components/oni/OniCreatorStudio|components/oni/OniCreatorReviewDock|components/oni/OniAdminPage|data/creator-publish|data/gallery|lib/oni-creator\.functions)\.tsx?\(' /tmp/typecheck.log; then
            echo "Creator-specific TypeScript errors found."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Repository has pre-existing TypeScript errors outside Creator scope; Creator files are clean."
          fi
      - name: Production build
        run: bun run build

# redeploy-marker: latest-main-production
