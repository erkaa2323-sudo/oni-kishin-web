name: PR Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required site files
        run: |
          set -euo pipefail
          required=(
            "index.html"
            "sw.js"
            "manifest.webmanifest"
            "offline.html"
            "app/app.css"
            "icons/icon-192.png"
            "icons/icon-512.png"
            "icons/icon-maskable-512.png"
            "icons/apple-touch-icon.png"
          )
          for f in "${required[@]}"; do
            [ -f "$f" ] || { echo "Missing required file: $f"; exit 1; }
          done

      - name: Validate manifest JSON
        run: |
          node -e 'JSON.parse(require("node:fs").readFileSync("manifest.webmanifest","utf8")); console.log("manifest.webmanifest OK")'

      - name: Validate JavaScript syntax
        run: |
          node --check sw.js
          node --check src/index.js
          node --check src/secure-worker.js

      - name: Validate ONI AI payload budget
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const bodyLimit = 128 * 1024;
          const backend = fs.readFileSync("src/index.js", "utf8");
          const gateway = fs.readFileSync("src/secure-worker.js", "utf8");
          if (!backend.includes("const MAX_BODY_BYTES = 128 * 1024;")) throw new Error("src/index.js MAX_BODY_BYTES must stay at 128 KB");
          if (!gateway.includes("const MAX_BODY_BYTES = 128 * 1024;")) throw new Error("src/secure-worker.js MAX_BODY_BYTES must stay at 128 KB");

          const payload = {
            message: "hi",
            history: Array.from({length: 18}, (_, i) => ({
              role: i % 2 ? "ai" : "user",
              text: `turn-${i} ` + "x".repeat(240)
            })),
            knowledge: {
              source: "Client snapshot is condensed. Firebase tools remain authoritative for clan facts.",
              counts: {members: 72, garage: 36, music: 120, playableTracks: 88, participants: 20},
              snapshot: {members: 48, garage: 24, music: 36, participants: 20},
              meet: {
                id: "current",
                name: "ONI NIGHT MEET",
                enabled: true,
                startAt: "2026-09-02T00:00:00.000Z",
                durationMinutes: 20,
                maxPlayers: 20,
                status: "live",
                mode: "squad",
                location: "ONI HQ"
              },
              members: Array.from({length: 48}, (_, i) => ({
                id: `member-${i}`,
                nick: `Nick ${i}`,
                first: `First ${i}`,
                last: `Last ${i}`,
                name: `First ${i} Last ${i}`,
                cpmid: `CPM-${1000 + i}`,
                direction: i % 2 ? "street" : "drift",
                role: i < 4 ? "leader" : "member",
                title: "Squad Driver",
                status: "active"
              })),
              garage: Array.from({length: 24}, (_, i) => ({
                id: `garage-${i}`,
                name: `Build ${i}`,
                title: `Garage Build ${i}`,
                car: `Car ${i}`,
                model: `Model ${i}`,
                brand: "ONI",
                owner: `Nick ${i}`,
                nick: `Nick ${i}`,
                status: "ready",
                type: "drift"
              })),
              music: Array.from({length: 36}, (_, i) => ({
                id: `music-${i}`,
                title: `Track ${i}`,
                name: `Track ${i}`,
                artist: `Artist ${i}`,
                status: "published"
              })),
              participants: Array.from({length: 20}, (_, i) => ({
                id: `participant-${i}`,
                memberId: `member-${i}`,
                nick: `Nick ${i}`,
                name: `First ${i}`,
                cpmId: `CPM-${1000 + i}`,
                source: "meet"
              }))
            }
          };

          const bytes = new TextEncoder().encode(JSON.stringify(payload)).byteLength;
          if (bytes > bodyLimit) {
            throw new Error(`realistic ONI AI payload exceeds limit: ${bytes} bytes`);
          }
          console.log(`ONI AI payload budget OK (${bytes} / ${bodyLimit} bytes)`);
          NODE

      - name: Verify sw.js precache files exist
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const sw = fs.readFileSync("sw.js", "utf8");
          const matches = [...sw.matchAll(/BASE\s*\+\s*"([^"]+)"/g)].map(m => m[1]);
          const unique = [...new Set(matches)];
          let failed = false;
          for (const rel of unique) {
            if (!fs.existsSync(rel)) {
              console.error(`sw.js precache references missing file: ${rel}`);
              failed = true;
            }
          }
          if (failed) process.exit(1);
          console.log(`sw.js precache check OK (${unique.length} assets)`);
          NODE

      - name: Verify Firestore payload/rules contract
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("index.html", "utf8");
          const rules = fs.readFileSync("firestore.rules", "utf8");
          const mustContain = [
            {label:"applications payload keys", parts:['"last"', '"first"', '"age"', '"gender"', '"cpmid"', '"nick"', '"direction"', '"contactType"', '"contact"', '"experience"', '"message"', '"status"']},
            {label:"orders payload keys", parts:['"orderNo"', '"productId"', '"productName"', '"unitPrice"', '"quantity"', '"total"', '"cpmNick"', '"cpmId"', '"status"']},
            {label:"meet payload keys", parts:['"meetId"', '"meetStartAt"', '"memberId"', '"nick"', '"name"', '"cpmId"', '"source"']}
          ];
          for (const item of mustContain) {
            for (const p of item.parts) {
              if (!rules.includes(p)) {
                console.error(`firestore.rules missing ${p} in ${item.label}`);
                process.exit(1);
              }
            }
          }
          if (!html.includes('addDoc(collection(db,"applications"),{')) throw new Error("applications payload not found in index.html");
          if (!html.includes('addDoc(collection(db,"orders"),{')) throw new Error("orders payload not found in index.html");
          if (!html.includes('setDoc(doc(db,"meetParticipants",k),{')) throw new Error("meetParticipants payload not found in index.html");
          console.log("Firestore payload/rules contract checks OK");
          NODE

      - name: Verify GitHub Pages source files
        run: |
          set -euo pipefail
          [ -f ".github/workflows/main.yml" ] || { echo "Missing Pages workflow"; exit 1; }
          grep -q '<link rel="manifest" href="manifest.webmanifest">' index.html || { echo "Missing manifest link in index.html"; exit 1; }
          grep -q 'serviceWorker.register' index.html || { echo "Missing service worker registration in index.html"; exit 1; }

      - name: Validate ONI HUB v2 foundation
        run: npm run validate:v2
