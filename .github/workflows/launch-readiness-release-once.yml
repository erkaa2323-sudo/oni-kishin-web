name: ONI Launch Readiness Release Once

on:
  push:
    branches:
      - ops/launch-readiness-release
    paths:
      - .github/workflows/launch-readiness-release-once.yml

permissions:
  contents: read

concurrency:
  group: launch-readiness-release-once
  cancel-in-progress: false

env:
  TARGET_SHA: 7029a2caf08051ab3f29f0c24cd582a8ec4dce9e
  FIREBASE_PROJECT: oni-kishin-f59b4
  VERCEL_ORG_ID: team_TwApqwrDJ8DLSzIxQtQODqRz
  VERCEL_PROJECT_ID: prj_SvgXUOsqNhKpY7quhQIK0cmzwRbz

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[launch-release-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Confirm exact release SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.9.0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser engines
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Full release verification
        run: npm run check

  firebase-rules:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Load Google Cloud credentials
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Mint OAuth access token
        run: |
          python -m pip install --quiet google-auth requests
          ACCESS_TOKEN="$(python - <<'PY'
          import os
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account
          credentials = service_account.Credentials.from_service_account_file(
              os.environ["GOOGLE_APPLICATION_CREDENTIALS"],
              scopes=["https://www.googleapis.com/auth/cloud-platform"],
          )
          credentials.refresh(Request())
          print(credentials.token)
          PY
          )"
          echo "::add-mask::${ACCESS_TOKEN}"
          echo "ACCESS_TOKEN=${ACCESS_TOKEN}" >> "$GITHUB_ENV"
      - name: Ensure ONI NEXUS VAPID keypair
        run: |
          python -m pip install --quiet cryptography
          python - <<'PY'
          import base64, datetime as dt, os, requests
          from cryptography.hazmat.primitives.asymmetric import ec
          project=os.environ["FIREBASE_PROJECT"]; token=os.environ["ACCESS_TOKEN"]
          root=f"https://firestore.googleapis.com/v1/projects/{project}/databases/(default)/documents"
          headers={"Authorization":f"Bearer {token}","Content-Type":"application/json"}
          def b64url(raw): return base64.urlsafe_b64encode(raw).decode("ascii").rstrip("=")
          config_url=f"{root}/pushConfig/vapid"; current=requests.get(config_url,headers=headers,timeout=20)
          if current.status_code==200:
            fields=current.json().get("fields",{}); public_key=fields.get("publicKey",{}).get("stringValue",""); private_key=fields.get("privateKey",{}).get("stringValue","")
            if not public_key or not private_key: raise SystemExit("Existing VAPID document incomplete; refusing rotation")
          elif current.status_code==404:
            private=ec.generate_private_key(ec.SECP256R1()); numbers=private.private_numbers(); public=numbers.public_numbers
            public_key=b64url(b"\x04"+public.x.to_bytes(32,"big")+public.y.to_bytes(32,"big")); private_key=b64url(numbers.private_value.to_bytes(32,"big")); now=dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00","Z")
            payload={"fields":{"enabled":{"booleanValue":True},"publicKey":{"stringValue":public_key},"privateKey":{"stringValue":private_key},"subject":{"stringValue":"mailto:erkaa2323@gmail.com"},"createdAt":{"timestampValue":now},"updatedAt":{"timestampValue":now}}}
            requests.patch(config_url,headers=headers,json=payload,timeout=20).raise_for_status()
          else: raise SystemExit(f"Unable to read VAPID config: HTTP {current.status_code}")
          now=dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00","Z")
          requests.patch(f"{root}/site/nexusPush",headers=headers,json={"fields":{"enabled":{"booleanValue":True},"publicKey":{"stringValue":public_key},"updatedAt":{"timestampValue":now}}},timeout=20).raise_for_status()
          PY
      - name: Compose and create Firebase Rules ruleset
        run: |
          node scripts/economy-v3-ternary-patch.mjs
          node scripts/compose-firestore-rules.mjs
          python - <<'PY' > /tmp/ruleset.json
          import json
          from pathlib import Path
          print(json.dumps({"source":{"files":[{"name":"firestore.rules","content":Path("firestore.test.generated.rules").read_text(encoding="utf-8")}]}}))
          PY
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json" -X POST --data-binary @/tmp/ruleset.json "https://firebaserules.googleapis.com/v1/projects/${FIREBASE_PROJECT}/rulesets" > /tmp/ruleset-response.json
          RULESET_NAME="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/ruleset-response.json',encoding='utf-8'))['name'])
          PY
          )"
          echo "RULESET_NAME=${RULESET_NAME}" >> "$GITHUB_ENV"
      - name: Release Firestore ruleset
        run: |
          python - <<'PY' > /tmp/release.json
          import json,os
          project=os.environ['FIREBASE_PROJECT']
          print(json.dumps({"release":{"name":f"projects/{project}/releases/cloud.firestore","rulesetName":os.environ['RULESET_NAME']},"updateMask":"rulesetName"}))
          PY
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json" -X PATCH --data-binary @/tmp/release.json "https://firebaserules.googleapis.com/v1/projects/${FIREBASE_PROJECT}/releases/cloud.firestore"

  vercel-production:
    needs: firebase-rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require Vercel deployment token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is not configured."
            exit 1
          fi
      - name: Checkout exact verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Confirm exact release SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.9.0
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.7
      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build locally on GitHub runner
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy verified prebuilt output to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
