name: ONI Economy Audit Only

on:
  push:
    branches:
      - audit/oni-economy-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oni-economy-audit-only
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save

      - name: Full TypeScript audit
        run: bun run typecheck

      - name: Production build without deploy
        run: bun run build

      - name: Apply expression-safe ternary candidate
        run: node scripts/economy-v3-ternary-patch.mjs

      - name: Compose Firestore rules without deploy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          base=Path("firestore.rules").read_text(encoding="utf-8")
          marker="    match /{document=**} { allow read, write: if false; }"
          if marker not in base:
              raise SystemExit("Firestore deny-all marker missing")
          fragments=[
              ("firestore.creator.rules.fragment","match /creatorPublishRequests/"),
              ("firestore.nexus.rules.fragment","match /pushSubscriptions/"),
              ("firestore.progression.v3.rules.fragment","function currentWeekPathV3()"),
          ]
          combined=base
          for path, needle in fragments:
              if needle not in combined:
                  combined=combined.replace(marker,Path(path).read_text(encoding="utf-8").rstrip()+"\n\n"+marker,1)
          Path("firestore.economy-audit.rules").write_text(combined,encoding="utf-8")
          PY
          grep -q 'match /progressionMissionClaims/' firestore.economy-audit.rules
          grep -q 'match /progressionWeekly/' firestore.economy-audit.rules
          grep -q 'match /meetAttendance/' firestore.economy-audit.rules
          grep -q 'match /progressionAchievementClaims/' firestore.economy-audit.rules
          grep -q 'match /progressionPrestigeClaims/' firestore.economy-audit.rules
          grep -q 'match /progressionSeasonArchive/' firestore.economy-audit.rules
          grep -q '"vault_spend"' firestore.economy-audit.rules
          grep -q '"weekly_mission"' firestore.economy-audit.rules
          grep -q 'validLedgerCreateV3' firestore.economy-audit.rules
          grep -q 'validEconomyProfileUpdateV3' firestore.economy-audit.rules
          grep -q 'freshProfileActionV3' firestore.economy-audit.rules
          grep -q 'afterProfileFreshV3' firestore.economy-audit.rules
          grep -q '? validVaultProfileV3' firestore.economy-audit.rules
          grep -q '? meetCount >= 1' firestore.economy-audit.rules
          echo '=== FIRESTORE LINE CONTEXT 588-600 ==='
          nl -ba firestore.economy-audit.rules | sed -n '588,600p'
          echo '=== FIRESTORE LINE CONTEXT 651-663 ==='
          nl -ba firestore.economy-audit.rules | sed -n '651,663p'
          echo '=== FIRESTORE LINE CONTEXT 746-758 ==='
          nl -ba firestore.economy-audit.rules | sed -n '746,758p'

      - name: Install rules test harness
        run: bun add --no-save @firebase/rules-unit-testing

      - name: Firestore economy security integration
        shell: bash
        run: |
          set -euo pipefail
          cat > firebase.economy-audit.json <<'JSON'
          {
            "firestore": { "rules": "firestore.economy-audit.rules" },
            "emulators": { "firestore": { "port": 8089 }, "ui": { "enabled": false } }
          }
          JSON
          bunx firebase-tools@14.16.0 emulators:exec --only firestore --project demo-oni-economy --config firebase.economy-audit.json "bun scripts/economy-rules-test.mjs && bun scripts/economy-rule-coverage-report.mjs" 2>&1 | tee economy-emulator.log
          grep -q 'ECONOMY_SECURITY_INTEGRATION_OK' economy-emulator.log
          grep -q 'RULE_COVERAGE_FOCUSED_OK' economy-emulator.log
          if grep -q 'maximum of 1000 expressions' economy-emulator.log; then
            echo "=== FIRESTORE DEBUG: EXPRESSION LIMIT ==="
            grep -in -C 12 '1000 expressions' firestore-debug.log || true
            echo "Firestore rules exceeded expression limit"
            exit 1
          fi
          if grep -q 'evaluation error' economy-emulator.log; then
            echo "=== FIRESTORE DEBUG: EVALUATION ERRORS ==="
            grep -in -C 15 'evaluation error' firestore-debug.log || true
            grep -in -C 15 'Error' firestore-debug.log | tail -n 240 || true
            echo "Firestore rules emitted an evaluation error"
            exit 1
          fi

      - name: Economy invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'claimWeeklyMission' src/data/progression.ts
          grep -q 'claimAchievement' src/data/progression.ts
          grep -q 'claimPrestige' src/data/progression.ts
          grep -q 'meetAttendance' src/data/progression.ts
          grep -q 'lastAction: { type: "vault_unlock"' src/data/progression.ts
          grep -q 'lastAction: { type: "weekly_claim"' src/data/progression.ts
          grep -q 'lastAction: { type: "meet_reward"' src/data/progression.ts
          grep -q 'lastAction: { type: "prestige"' src/data/progression.ts
          grep -q 'balanceAfter' src/data/progression.ts
          grep -q 'OniCosmeticBridge' src/routes/__root.tsx
          grep -q 'OniEconomyAdminDock' src/routes/admin.tsx
          grep -q 'CLAIM REWARD' src/components/oni/OniProgressionStage.tsx
          grep -q 'PRESTIGE ASCENSION' src/components/oni/OniProgressionStage.tsx
          grep -q '^  contents: read$' .github/workflows/economy-audit-only.yml
          grep -q 'firestore.progression.v3.rules.fragment' .github/workflows/economy-audit-only.yml
          grep -q 'economy-v3-ternary-patch.mjs' .github/workflows/economy-audit-only.yml
          grep -q 'economy-rule-coverage-report.mjs' .github/workflows/economy-audit-only.yml
          if grep -q 'uses: actions/deploy-pages' .github/workflows/economy-audit-only.yml; then exit 1; fi
          if grep -q 'uses: amondnet/vercel-action' .github/workflows/economy-audit-only.yml; then exit 1; fi
          echo "NO_DEPLOY_AUDIT_OK"
