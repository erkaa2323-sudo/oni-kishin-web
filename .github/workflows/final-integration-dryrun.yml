name: ONI Final Integration Dry Run

on:
  push:
    branches:
      - final/predeploy-2026-09-08
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oni-final-integration-dryrun
  cancel-in-progress: true

jobs:
  merge-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout final predeploy branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Economy V2
        run: git fetch origin audit/oni-economy-v2

      - name: Dry-run merge and expose only real conflicts
        shell: bash
        run: |
          set +e
          git -c user.name='ONI Final Audit' -c user.email='noreply@oni.local' merge --no-commit --no-ff origin/audit/oni-economy-v2 > /tmp/merge.log 2>&1
          code=$?
          set -e
          cat /tmp/merge.log
          echo '--- CONFLICT FILES ---'
          git diff --name-only --diff-filter=U || true
          echo '--- CONFLICT HUNKS ---'
          git diff --cc -- . ':(exclude)package-lock.json' || true
          if [ "$code" -eq 0 ]; then
            echo 'MERGE_CLEAN'
          else
            echo 'MERGE_CONFLICTS_PRESENT'
          fi
          git merge --abort || true

      - name: Confirm Vercel auto deploy stays disabled
        run: |
          node -e 'const v=require("./vercel.json"); if(v?.git?.deploymentEnabled !== false) process.exit(1); console.log("VERCEL_GIT_DEPLOY_DISABLED")'
