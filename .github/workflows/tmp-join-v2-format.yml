name: Temporary Join V2 Formatter

on:
  push:
    branches:
      - gpt6/join-request-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt6/join-request-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci --no-audit --no-fund
      - name: Apply hook-safety cleanup and format
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/oni/OniJoinRequestV2.tsx')
          s = p.read_text()
          s = s.replace(
              'import { useEffect, useId, useMemo, useState } from "react";',
              'import { useCallback, useEffect, useId, useMemo, useState } from "react";'
          )
          s = s.replace(
              '''  const refreshMembershipStatus = async (target: JoinMembershipWatch) => {\n    setRefreshingStatus(true);\n    const result = await checkJoinMembershipStatus(target);\n    setMembershipStatus(result);\n    setRefreshingStatus(false);\n  };''',
              '''  const refreshMembershipStatus = useCallback(async (target: JoinMembershipWatch) => {\n    setRefreshingStatus(true);\n    const result = await checkJoinMembershipStatus(target);\n    setMembershipStatus(result);\n    setRefreshingStatus(false);\n  }, []);'''
          )
          s = s.replace('  }, []);\n\n  useEffect(() => {\n    if (!watch || membershipStatus.state !== "pending")', '  }, [refreshMembershipStatus]);\n\n  useEffect(() => {\n    if (!watch || membershipStatus.state !== "pending")', 1)
          s = s.replace(
              '  }, [watch, membershipStatus.state]);',
              '  }, [watch, membershipStatus.state, refreshMembershipStatus]);'
          )
          s = s.replace(
              '      setStep((Math.max(0, errorStep) as StepIndex) ?? 0);',
              '      setStep(Math.max(0, errorStep) as StepIndex);'
          )
          p.write_text(s)
          PY
          npx prettier --write src/components/oni/OniJoinRequestV2.tsx src/routes/join.tsx tests/route-smoke.mjs
      - name: Commit formatted result
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/oni/OniJoinRequestV2.tsx src/routes/join.tsx tests/route-smoke.mjs
          git commit -m "style: format Join Request V2"
          git push origin HEAD:gpt6/join-request-v2
