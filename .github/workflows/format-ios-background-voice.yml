name: Format iOS Background Voice

on:
  push:
    branches:
      - gpt6/ios-background-voice
    paths:
      - src/components/oni/MeetVoice.tsx
      - .github/workflows/format-ios-background-voice.yml

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt6/ios-background-voice
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install -g npm@11.9.0
      - run: npm ci
      - name: Format MeetVoice
        run: npx prettier --write src/components/oni/MeetVoice.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- src/components/oni/MeetVoice.tsx; then
            echo "MeetVoice already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/oni/MeetVoice.tsx
          git commit -m "style: apply Prettier to MeetVoice"
          git push origin HEAD:gpt6/ios-background-voice
