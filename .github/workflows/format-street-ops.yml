name: Format Street Ops

on:
  push:
    branches:
      - gpt6/street-ops

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt6/street-ops
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install prettier --write src/components/oni/OniStreetOpsStage.tsx src/routes/street-ops.tsx src/lib/oni-nav.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/oni/OniStreetOpsStage.tsx src/routes/street-ops.tsx src/lib/oni-nav.ts
          git commit -m "style(street-ops): apply prettier"
          git push
