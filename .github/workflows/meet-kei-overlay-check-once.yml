name: Meet Kei Overlay Check Once
on:
  push:
    branches: [fix/meet-kei-overlay]
    paths:
      - 'src/components/oni/KeiMeetHostCubism5.tsx'
      - '.github/workflows/meet-kei-overlay-check-once.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
