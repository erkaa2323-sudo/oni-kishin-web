name: ONI Economy Branch Sync Patch

on:
  push:
    branches:
      - audit/oni-economy-v2
    paths:
      - .github/workflows/economy-branch-sync-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/oni-economy-v2
          fetch-depth: 0
      - name: Sync action markers across client rules and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Client: every profile-mutating economy transaction declares one atomic action marker.
          replace_once(
              "src/data/progression.ts",
              '    tx.update(profileRef, { coin: balanceAfter, updatedAt: serverTimestamp() });',
              '    tx.update(profileRef, { coin: balanceAfter, lastAction: { type: "weekly_claim", key: mission.id, weekId }, updatedAt: serverTimestamp() });',
          )
          replace_once(
              "src/data/progression.ts",
              '    tx.update(profileRef, { xp: 0, prestige: nextPrestige, updatedAt: serverTimestamp() });',
              '    tx.update(profileRef, { xp: 0, prestige: nextPrestige, lastAction: { type: "prestige", key: String(nextPrestige) }, updatedAt: serverTimestamp() });',
          )
          replace_once(
              "src/data/progression.ts",
              '    tx.update(ref, { coin: balanceAfter, unlocked: [...p.unlocked, item.id], updatedAt: serverTimestamp() });',
              '    tx.update(ref, { coin: balanceAfter, unlocked: [...p.unlocked, item.id], lastAction: { type: "vault_unlock", key: item.id }, updatedAt: serverTimestamp() });',
          )
          replace_once(
              "src/data/progression.ts",
              '''    tx.update(profileRef, {
      xp: p.xp + reward.xp,
      coin: balanceAfter,
      lifetimeXp: p.lifetimeXp + reward.xp,
      seasonXp: p.seasonXp + reward.xp,
      meetCount: p.meetCount + 1,
      updatedAt: serverTimestamp(),
    });''',
              '''    tx.update(profileRef, {
      xp: p.xp + reward.xp,
      coin: balanceAfter,
      lifetimeXp: p.lifetimeXp + reward.xp,
      seasonXp: p.seasonXp + reward.xp,
      meetCount: p.meetCount + 1,
      lastAction: { type: "meet_reward", key: nonce },
      updatedAt: serverTimestamp(),
    });''',
          )

          # Rules: avoid unsupported number->string conversion; validate the existing string key explicitly.
          replace_once(
              "firestore.progression.rules.fragment",
              '        && getAfter(/databases/$(database)/documents/progressionProfiles/$(request.auth.uid)).data.lastAction.key == request.resource.data.prestige.toString()',
              '        && validPrestigeKey(request.resource.data.prestige, getAfter(/databases/$(database)/documents/progressionProfiles/$(request.auth.uid)).data.lastAction.key)',
          )

          # Emulator integration test mirrors production transaction shapes exactly.
          replace_once(
              "scripts/economy-rules-test.mjs",
              '''  tx.update(profileRef, {
    coin: Number(row.coin) - 700,
    unlocked: [...row.unlocked, "frame-crimson"],
    updatedAt: serverTimestamp(),
  });''',
              '''  tx.update(profileRef, {
    coin: Number(row.coin) - 700,
    unlocked: [...row.unlocked, "frame-crimson"],
    lastAction: { type: "vault_unlock", key: "frame-crimson" },
    updatedAt: serverTimestamp(),
  });''',
          )
          replace_once(
              "scripts/economy-rules-test.mjs",
              '  tx.update(profileRef, { coin: currentCoin + 300, updatedAt: serverTimestamp() });',
              '  tx.update(profileRef, { coin: currentCoin + 300, lastAction: { type: "weekly_claim", key: "meet-2", weekId: "2026-W37" }, updatedAt: serverTimestamp() });',
          )
          replace_once(
              "scripts/economy-rules-test.mjs",
              '''  tx.update(profileRef, {
    xp: Number(row.xp) + 100,
    coin: balanceAfter,
    lifetimeXp: Number(row.lifetimeXp) + 100,
    seasonXp: Number(row.seasonXp) + 100,
    meetCount: Number(row.meetCount) + 1,
    updatedAt: serverTimestamp(),
  });''',
              '''  tx.update(profileRef, {
    xp: Number(row.xp) + 100,
    coin: balanceAfter,
    lifetimeXp: Number(row.lifetimeXp) + 100,
    seasonXp: Number(row.seasonXp) + 100,
    meetCount: Number(row.meetCount) + 1,
    lastAction: { type: "meet_reward", key: nonce },
    updatedAt: serverTimestamp(),
  });''',
          )
          replace_once(
              "scripts/economy-rules-test.mjs",
              '  tx.update(profileRef, { xp: 0, prestige: 1, updatedAt: serverTimestamp() });',
              '  tx.update(profileRef, { xp: 0, prestige: 1, lastAction: { type: "prestige", key: "1" }, updatedAt: serverTimestamp() });',
          )
          PY
          git diff --check
          git diff -- src/data/progression.ts firestore.progression.rules.fragment scripts/economy-rules-test.mjs
      - name: Commit synchronized branch patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ONI Economy Audit"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/progression.ts firestore.progression.rules.fragment scripts/economy-rules-test.mjs
          git commit -m "Sync economy action markers across client rules and tests"
          git push origin HEAD:audit/oni-economy-v2
