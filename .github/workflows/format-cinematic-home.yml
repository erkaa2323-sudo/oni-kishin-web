name: Format Cinematic Home 2.0

on:
  push:
    branches:
      - gpt6/cinematic-home-2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt6/cinematic-home-2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install prettier --write src/components/oni/OniCinematicHome2.tsx src/components/oni/OniCinematicHome2.css src/routes/index.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/oni/OniCinematicHome2.tsx src/components/oni/OniCinematicHome2.css src/routes/index.tsx
          git commit -m "style(home): apply prettier"
          git push
