name: Kei Browser Smoke

on:
  push:
    branches: [chatgpt/kei-final-browser-test]
    paths:
      - 'public/kei-live2d-host.html'
      - 'public/kei-pixi-texture-test.html'
      - 'src/components/oni/KeiMeetHostCubism5.tsx'
      - 'src/components/oni/RenMeetHost.tsx'
      - 'src/routes/meet.tsx'
      - 'scripts/prepare-live2d-core.mjs'
      - 'tests/kei-browser-smoke.mjs'
      - 'tests/kei-meet-integration.mjs'
      - '.github/workflows/kei-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install app dependencies
        run: bun install --no-save
      - name: Prepare Cubism 5 runtime and Kei assets
        run: node scripts/prepare-live2d-core.mjs
      - name: Install Playwright browsers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start static Kei host
        run: |
          python3 -m http.server 4173 -d public > /tmp/kei-http.log 2>&1 &
          echo $! > /tmp/kei-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/kei-live2d-host.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kei-http.log
          exit 1
      - name: Verify visible Kei pixels in Chromium and WebKit
        run: node tests/kei-browser-smoke.mjs
      - name: Build production app
        run: bun run build
      - name: Start built ONI Cloudflare worker
        run: |
          npx wrangler@latest dev --config .output/server/wrangler.json --ip 127.0.0.1 --port 4174 > /tmp/oni-app.log 2>&1 &
          echo $! > /tmp/oni-app.pid
          for i in {1..60}; do
            status="$(curl -sS -o /tmp/meet-response.html -w '%{http_code}' http://127.0.0.1:4174/meet || true)"
            if [ "$status" = "200" ]; then exit 0; fi
            if ! kill -0 "$(cat /tmp/oni-app.pid)" 2>/dev/null; then
              echo "Wrangler exited before /meet became ready."
              cat /tmp/oni-app.log
              exit 1
            fi
            sleep 1
          done
          echo "Built worker did not return HTTP 200 for /meet."
          cat /tmp/oni-app.log
          cat /tmp/meet-response.html || true
          exit 1
      - name: Verify Kei inside real Meet page in Chromium and WebKit
        env:
          KEI_APP_ORIGIN: http://127.0.0.1:4174
        run: node tests/kei-meet-integration.mjs
