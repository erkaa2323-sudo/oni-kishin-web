name: Admin V3 Type Fix

on:
  push:
    branches:
      - gpt6/admin-v3-control-center

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gpt6/admin-v3-control-center

      - name: Fix dashboard card typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/oni/OniAdminV3.tsx')
          text = path.read_text()
          old = '  const cards = [\n'
          new = '''  const cards: Array<{\n    label: string;\n    value: string | number;\n    icon: typeof Users;\n    jump: Jump;\n  }> = [\n'''
          if old not in text:
              raise SystemExit('dashboard cards declaration not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit type fix
        run: |
          if git diff --quiet; then
            echo "Type fix already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/oni/OniAdminV3.tsx
          git commit -m "fix(admin): type dashboard quick links"
          git push origin HEAD:gpt6/admin-v3-control-center
