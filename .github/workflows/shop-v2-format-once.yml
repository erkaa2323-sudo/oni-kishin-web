name: Shop V2 Format Once

on:
  push:
    branches:
      - gpt6/shop-v2-cpm-premium

permissions:
  contents: write

concurrency:
  group: shop-v2-format-once
  cancel-in-progress: false

jobs:
  format:
    if: github.ref == 'refs/heads/gpt6/shop-v2-cpm-premium'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: gpt6/shop-v2-cpm-premium
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.9.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format Shop V2 files
        run: >-
          npx --no-install prettier --write
          src/components/oni/OniCosmeticBridge.tsx
          src/components/oni/OniShopV2Stage.tsx
          src/lib/oni-shop.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Shop V2 files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/oni/OniCosmeticBridge.tsx src/components/oni/OniShopV2Stage.tsx src/lib/oni-shop.ts
          git commit -m "chore: format Shop V2"
          git push origin HEAD:gpt6/shop-v2-cpm-premium
