name: Vercel Prebuilt Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vercel-prebuilt-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-prebuilt-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_TwApqwrDJ8DLSzIxQtQODqRz
      VERCEL_PROJECT_ID: prj_SvgXUOsqNhKpY7quhQIK0cmzwRbz
    steps:
      - name: Require Vercel deployment token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is not configured."
            echo "No production changes were made."
            exit 1
          fi

      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save

      - name: Install Vercel CLI
        run: bun add --global vercel@latest

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build locally on GitHub runner
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
