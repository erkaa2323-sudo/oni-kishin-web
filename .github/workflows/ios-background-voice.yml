name: iOS Background Voice
on:
  pull_request:
    paths:
      - "ios/**"
      - "src/lib/native-voice.ts"
      - "src/components/oni/MeetVoice.tsx"
      - ".github/workflows/ios-background-voice.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-voice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Resolve Swift packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project ONIHub.xcodeproj -scheme ONIHub
      - name: Build iOS Simulator target
        working-directory: ios
        run: >-
          xcodebuild
          -project ONIHub.xcodeproj
          -scheme ONIHub
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
