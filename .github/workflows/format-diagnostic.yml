name: Format Diagnostic

on:
  push:
    branches:
      - fix/launch-readiness

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci --no-audit --no-fund
      - name: Print exact Prettier diff
        run: |
          npx --no-install prettier --write src/data/meet.ts src/data/meet-realtime.ts
          git diff -- src/data/meet.ts src/data/meet-realtime.ts
