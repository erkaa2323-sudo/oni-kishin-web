name: Format Diagnostic

on:
  pull_request:
    paths:
      - "tests/kei-meet-integration.mjs"
      - "src/components/oni/OniEventRewardDock.tsx"
      - ".github/workflows/format-diagnostic.yml"

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci --no-audit --no-fund
      - name: Show exact Prettier diff
        run: |
          npx --no-install prettier --write tests/kei-meet-integration.mjs src/components/oni/OniEventRewardDock.tsx
          git diff -- tests/kei-meet-integration.mjs src/components/oni/OniEventRewardDock.tsx
