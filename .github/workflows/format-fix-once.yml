name: Format Fix Once

on:
  push:
    branches:
      - gpt6/meet-admin-fixes

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt6/meet-admin-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci --no-audit --no-fund
      - name: Prettier write exact failing files
        run: |
          npx --no-install prettier --write \
            src/admin-cleanup.css \
            src/components/oni/KeiMeetHostCubism5.tsx \
            src/components/oni/OniControlCenter.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "ONI CI Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add src/admin-cleanup.css src/components/oni/KeiMeetHostCubism5.tsx src/components/oni/OniControlCenter.tsx
          git commit -m "style: apply Prettier to admin and Meet files"
          git push origin HEAD:gpt6/meet-admin-fixes
