name: Format Creator Once

on:
  push:
    branches:
      - gpt6/creator-cloudflare-free
    paths:
      - ".github/workflows/format-creator-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt6/creator-cloudflare-free
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/lib/oni-creator.functions.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/lib/oni-creator.functions.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/oni-creator.functions.ts
          git commit -m "style: format Creator server"
          git push origin HEAD:gpt6/creator-cloudflare-free
