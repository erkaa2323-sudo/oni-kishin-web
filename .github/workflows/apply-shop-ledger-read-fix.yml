name: Apply Shop Ledger Read Fix

on:
  push:
    branches:
      - fix/shop-ledger-read

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[shop-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shop-ledger-read
      - name: Patch production unlock and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/data/progression.ts')
          s = p.read_text(encoding='utf-8')
          before = '''  await runTransaction(firebaseDb, async (tx) => {\n    const [snap, spendSnap] = await Promise.all([tx.get(ref), tx.get(spendRef)]);\n    if (!snap.exists()) throw new Error("profile_required");\n    const p = parseProgressionProfile(user.uid, snap.data());\n    if (p.unlocked.includes(item.id) || spendSnap.exists()) throw new Error("already_unlocked");'''
          after = '''  await runTransaction(firebaseDb, async (tx) => {\n    const snap = await tx.get(ref);\n    if (!snap.exists()) throw new Error("profile_required");\n    const p = parseProgressionProfile(user.uid, snap.data());\n    if (p.unlocked.includes(item.id)) throw new Error("already_unlocked");'''
          if before not in s:
              raise SystemExit('progression patch marker missing')
          p.write_text(s.replace(before, after, 1), encoding='utf-8')

          t = Path('scripts/economy-vault-social-test.mjs')
          s = t.read_text(encoding='utf-8')
          before = '''  const socialRef = doc(db, "socialEvents", `${memberUid}_cosmetic_frame-crimson`);\n\n  await assertSucceeds('''
          after = '''  const socialRef = doc(db, "socialEvents", `${memberUid}_cosmetic_frame-crimson`);\n\n  // A first-time purchase has no spend ledger yet. Production rules intentionally\n  // deny reading that missing document, so the client must not pre-read it.\n  await assertFails(getDoc(spendRef));\n\n  await assertSucceeds('''
          if before not in s:
              raise SystemExit('regression patch marker missing')
          t.write_text(s.replace(before, after, 1), encoding='utf-8')
          PY
      - name: Remove one-off patch workflow
        run: rm .github/workflows/apply-shop-ledger-read-fix.yml
      - name: Commit patch
        run: |
          git config user.name "Oni-Kishin"
          git config user.email "erkaa2323@gmail.com"
          git add src/data/progression.ts scripts/economy-vault-social-test.mjs .github/workflows/apply-shop-ledger-read-fix.yml
          git commit -m "fix: stop pre-reading missing vault spend ledger [shop-fix-applied]"
          git push origin HEAD:fix/shop-ledger-read
