name: ONI NEXUS Predeploy Audit
on:
  push:
    branches: [chatgpt/oni-nexus-predeploy-final]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --no-save
      - name: Nexus targeted TypeScript audit
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E 'src/(lib/(pwa|nexus-push|nexus-push\.functions|nexus-push-admin|oni-progression|progression-rewards)|components/oni/(OniNexusDock|NexusMeetPushBridge|OniProgressionStage|OniProgressionRewardBridge|OniEventRewardDock|OniSocialHub|OniCrewStage)|routes/(progression|admin|__root)|data/(admin|progression|progression-admin|creator-publish|social))\.tsx?\(' /tmp/typecheck.log; then
            echo "ONI NEXUS-specific TypeScript errors found."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then echo "Repository has pre-existing TypeScript errors outside ONI NEXUS scope; targeted files are clean."; fi
      - name: Validate Firestore rule composition
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path("firestore.rules").read_text(encoding="utf-8"); marker="    match /{document=**} { allow read, write: if false; }"
          if marker not in base: raise SystemExit("deny-all marker missing")
          combined=base
          for path,needle in [("firestore.creator.rules.fragment","match /creatorPublishRequests/"),("firestore.nexus.rules.fragment","match /pushSubscriptions/"),("firestore.progression.rules.fragment","match /progressionProfiles/")]:
            if needle not in combined: combined=combined.replace(marker,Path(path).read_text(encoding="utf-8").rstrip()+"\n\n"+marker,1)
          for needle in ["match /creatorPublishRequests/","match /pushSubscriptions/","match /progressionProfiles/","match /progressionMeetClaims/","match /progressionLedger/","match /socialEvents/","match /socialReactions/","match /reactionDaily/",marker]:
            if needle not in combined: raise SystemExit(f"missing {needle}")
          if combined.count(marker)!=1: raise SystemExit("deny-all marker count changed")
          print("Creator + Push + Progression + Social rules composed.")
          PY
      - name: Check service worker syntax
        run: node --check public/sw.js
      - name: Production build only
        run: bun run build
      - name: Confirm Nexus systems
        run: |
          grep -q 'sendNexusMeetPush' src/components/oni/NexusMeetPushBridge.tsx
          grep -q 'claimMeetAttendanceReward' src/components/oni/OniProgressionRewardBridge.tsx
          grep -q 'creator_approved' src/data/creator-publish.ts
          grep -q 'grantEventReward' src/components/oni/OniEventRewardDock.tsx
          grep -q 'reactToTarget' src/components/oni/OniSocialHub.tsx
          grep -q 'fetchPublicMemberProfile' src/data/social.ts
          grep -q 'match /socialEvents/' firestore.progression.rules.fragment
          grep -q 'count <= 8' firestore.progression.rules.fragment
          grep -q '/progression' src/routeTree.gen.ts
          echo "Push + Progression + Clan Social layer present."
