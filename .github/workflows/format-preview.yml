name: Format Preview

on:
  push:
    branches:
      - gpt6/world-system-foundation

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci --no-audit --no-fund
      - name: Print exact Prettier diff
        run: |
          npx --no-install prettier --write src/components/oni/OniProfileStage.tsx src/data/garage.ts
          git diff -- src/components/oni/OniProfileStage.tsx src/data/garage.ts
