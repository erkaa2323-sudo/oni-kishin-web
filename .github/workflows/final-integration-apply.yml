name: ONI Final Integration Apply

on:
  push:
    branches:
      - final/predeploy-2026-09-08
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oni-final-integration-apply
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout final predeploy branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Economy V2
        run: git fetch origin audit/oni-economy-v2

      - name: Merge Economy V2 while preserving main hardening
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor origin/audit/oni-economy-v2 HEAD; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            echo "ECONOMY_ALREADY_MERGED"
            exit 0
          fi
          git config user.name "ONI Final Audit"
          git config user.email "noreply@oni.local"
          git merge --no-commit --no-ff -X theirs origin/audit/oni-economy-v2
          echo "already_merged=false" >> "$GITHUB_OUTPUT"

      - name: Materialize audited Economy V3 rules for production
        if: steps.merge.outputs.already_merged == 'false'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/economy-v3-ternary-patch.mjs
          cp firestore.progression.v3.rules.fragment firestore.progression.rules.fragment
          grep -q 'function validEconomyProfileUpdateV3' firestore.progression.rules.fragment
          grep -q '? validVaultProfileV3' firestore.progression.rules.fragment
          grep -q 'function isEconomyAdminV3' firestore.progression.rules.fragment

      - name: Enforce one authorized admin render boundary
        if: steps.merge.outputs.already_merged == 'false'
        run: node scripts/final-admin-auth-patch.mjs

      - name: Confirm Vercel Git deployment remains disabled
        run: node -e 'const v=require("./vercel.json"); if(v?.git?.deploymentEnabled !== false) throw new Error("Vercel Git auto deploy must remain disabled"); console.log("VERCEL_GIT_DEPLOY_DISABLED")'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser engines for final gates
        run: npx playwright install --with-deps chromium webkit

      - name: Normalize only merged integration source
        if: steps.merge.outputs.already_merged == 'false'
        shell: bash
        run: |
          set -euo pipefail
          files="$({
            git diff --cached --name-only --diff-filter=ACMRT HEAD -- '*.js' '*.mjs' '*.ts' '*.tsx'
            git diff --name-only --diff-filter=ACMRT HEAD -- '*.js' '*.mjs' '*.ts' '*.tsx'
          } | sort -u)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs npx prettier --write
            printf '%s\n' "$files" | xargs npx eslint --fix
          fi

      - name: Full repository verification
        run: npm run check

      - name: Compose production Firestore rules
        run: node scripts/compose-firestore-rules.mjs

      - name: Economy security integration against production-composed rules
        shell: bash
        run: |
          set -euo pipefail
          cp firestore.test.generated.rules firestore.economy-audit.rules
          cat > firebase.economy-audit.json <<'JSON'
          {
            "firestore": { "rules": "firestore.economy-audit.rules" },
            "emulators": { "firestore": { "port": 8089 }, "ui": { "enabled": false } }
          }
          JSON
          npx firebase-tools@14.16.0 emulators:exec --only firestore --project demo-oni-economy --config firebase.economy-audit.json "node scripts/economy-rules-test.mjs && node scripts/economy-rule-coverage-report.mjs" 2>&1 | tee economy-emulator.log
          node scripts/economy-emulator-log-audit.mjs

      - name: Final integration invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f src/components/oni/OniCosmeticBridge.tsx
          test -f src/components/oni/OniEconomyAdminDock.tsx
          grep -q 'claimWeeklyMission' src/data/progression.ts
          grep -q 'claimAchievement' src/data/progression.ts
          grep -q 'claimPrestige' src/data/progression.ts
          grep -q 'meetAttendance' src/data/progression.ts
          grep -q 'OniCosmeticBridge' src/routes/__root.tsx
          grep -q 'OniEconomyAdminDock' src/components/oni/OniAdminPage.tsx
          grep -q '<OniAdminGate>' src/components/oni/OniAdminPage.tsx
          if grep -qE 'Oni(EconomyAdminDock|EventRewardDock)' src/routes/admin.tsx; then
            echo 'Admin-only dock escaped the authorization boundary'
            exit 1
          fi
          grep -q 'deploymentEnabled.*false' <(tr -d '\n ' < vercel.json)
          if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' src firestore.progression.rules.fragment; then
            echo 'Conflict markers remain'
            exit 1
          fi
          echo "FINAL_INTEGRATION_INVARIANTS_OK"

      - name: Remove generated audit files
        if: always()
        run: rm -f firestore.economy-audit.rules firebase.economy-audit.json economy-emulator.log firestore.test.generated.rules

      - name: Commit verified final integration
        if: steps.merge.outputs.already_merged == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Oni-Kishin"
          git config user.email "erkaa2323@gmail.com"
          git add -A
          git commit -m "Integrate Economy V2 into final predeploy"
          git push origin HEAD:final/predeploy-2026-09-08
