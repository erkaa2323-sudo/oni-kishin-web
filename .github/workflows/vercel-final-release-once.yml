name: Vercel Final Release Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vercel-final-release-once.yml

permissions:
  contents: read

concurrency:
  group: vercel-final-release-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_TwApqwrDJ8DLSzIxQtQODqRz
      VERCEL_PROJECT_ID: prj_SvgXUOsqNhKpY7quhQIK0cmzwRbz
    steps:
      - name: Require deployment token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.9.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.7

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
