name: GitHub Pages Gantzert Host

on:
  push:
    branches: [main]
    paths:
      - pages/ren-meet.html
      - src/components/oni/RenMeetHost.tsx
      - .github/workflows/github-pages-ren.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-meet-host
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Vercel-independent Gantzert page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/meet
          cp pages/ren-meet.html _site/meet/index.html
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=./meet/"><title>ONI HUB · GitHub Host</title></head><body style="margin:0;background:#050506;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh"><a href="./meet/" style="color:#fff">ONI MEET / GANTZERT + FELIXANDER</a></body></html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
