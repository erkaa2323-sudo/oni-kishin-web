name: Foundation Verification
on:
  pull_request:
  push:
    branches: [main, gpt6/foundation-hardening]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.9.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium webkit
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Foundation tests
        run: npm run test:foundation
      - name: Meet voice tests
        run: node --test tests/meet-voice.test.mjs
      - name: Firestore rules tests
        run: npm run test:rules
      - name: Economy audit
        run: npm run test:economy
      - name: Browser verification
        run: npm run test:browsers
