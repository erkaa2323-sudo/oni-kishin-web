name: PR85 Firestore Rules Dispatch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-pr79-production-dispatch.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Firestore rules after verified PR85 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run firebase-rules.yml --repo erkaa2323-sudo/oni-kishin-web --ref main
          echo "Firebase rules deployment dispatched from verified PR85 release."
