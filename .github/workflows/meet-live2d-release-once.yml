name: Meet Live2D Release Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/meet-live2d-release-once.yml"

permissions:
  contents: read

concurrency:
  group: meet-live2d-release-once
  cancel-in-progress: false

# Release trigger: PR #83 Meet Live2D join-layout parity production release
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: team_TwApqwrDJ8DLSzIxQtQODqRz
      VERCEL_PROJECT_ID: prj_SvgXUOsqNhKpY7quhQIK0cmzwRbz
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.9.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install browser engines
        run: npx --no-install playwright install --with-deps chromium webkit

      - name: Full release verification
        run: npm run check

      - name: Require Vercel deployment token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.7

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production bundle
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy verified prebuilt output to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
