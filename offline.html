<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>ONI HUB — Offline</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:
radial-gradient(circle at 50% 20%,rgba(255,32,51,.16),transparent 24rem),
radial-gradient(circle at 85% 80%,rgba(141,92,255,.12),transparent 25rem),#050507;
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f7fb}
.card{width:min(430px,100%);padding:28px;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:rgba(14,14,20,.82);box-shadow:0 28px 90px rgba(0,0,0,.5);text-align:center}
.logo{width:78px;height:78px;margin:auto;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,#ff2033,#8d5cff);font-weight:1000;font-size:25px;letter-spacing:.08em}
h1{font-size:24px;margin:20px 0 9px}p{margin:0;color:#a6a6b1;line-height:1.6;font-size:14px}
button{margin-top:22px;min-height:48px;border:0;border-radius:15px;padding:0 20px;background:#ff2033;color:white;font-weight:900}
small{display:block;margin-top:14px;color:#676775}
</style>
</head>
<body>
<main class="card">
  <div class="logo">ONI</div>
  <h1>Интернет холболт алга</h1>
  <p>ONI HUB-ийн хадгалагдсан хэсгүүдийг ашиглаж болно. Холболт сэргэхэд дахин оролдоорой.</p>
  <button onclick="location.reload()">Дахин оролдох</button>
  <small>ONI HUB • Offline mode</small>
</main>
</body>
</html>
