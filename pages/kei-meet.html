<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <title>ONI HUB · Kei Cinematic Meet Host</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #050506;
        color: #f5f5f7;
      }
      body {
        min-height: 100svh;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 60%, rgba(170, 11, 36, 0.24), transparent 48%),
          linear-gradient(180deg, #08080a, #020203);
      }
      .shell {
        min-height: 100svh;
        max-width: 920px;
        margin: auto;
        padding: max(env(safe-area-inset-top), 10px) 12px max(env(safe-area-inset-bottom), 10px);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 9px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 2px;
      }
      .brand {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.24em;
      }
      .sub {
        font-size: 7px;
        letter-spacing: 0.16em;
        color: rgba(255, 255, 255, 0.32);
        margin-top: 4px;
      }
      .status {
        display: flex;
        gap: 6px;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        padding: 6px 9px;
        font-size: 7px;
        letter-spacing: 0.14em;
        color: rgba(255, 255, 255, 0.42);
        background: rgba(0, 0, 0, 0.28);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #777;
      }
      .status.ready .dot {
        background: #78efb0;
        box-shadow: 0 0 12px rgba(120, 239, 176, 0.75);
      }
      .status.failed .dot {
        background: #e11d48;
      }
      .frame {
        position: relative;
        min-height: 0;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(0, 0, 0, 0.5);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.62);
      }
      .frame:before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 50% 70%,
            rgba(200, 20, 48, 0.22),
            rgba(50, 4, 12, 0.08) 36%,
            transparent 70%
          ),
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.02),
            transparent 24%,
            transparent 65%,
            rgba(0, 0, 0, 0.82)
          );
        pointer-events: none;
      }
      .orb {
        position: absolute;
        left: 50%;
        top: 48%;
        width: 72%;
        height: 44%;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(225, 29, 72, 0.09);
        border-radius: 50%;
        box-shadow: 0 0 80px rgba(225, 29, 72, 0.1);
        opacity: 0;
        transition: opacity 0.45s ease;
        pointer-events: none;
      }
      .frame.hot .orb {
        opacity: 1;
        animation: pulse 1.6s ease-in-out infinite;
      }
      .frame.good .orb {
        opacity: 1;
        border-color: rgba(110, 231, 183, 0.1);
        box-shadow: 0 0 80px rgba(110, 231, 183, 0.08);
      }
      @keyframes pulse {
        50% {
          transform: translate(-50%, -50%) scale(1.035);
          opacity: 0.55;
        }
      }
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: pan-y;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 8px;
        letter-spacing: 0.22em;
        color: rgba(255, 255, 255, 0.25);
        pointer-events: none;
      }
      .hosttag {
        position: absolute;
        left: 14px;
        top: 14px;
        z-index: 6;
      }
      .eyebrow {
        font-size: 6px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: rgba(255, 255, 255, 0.28);
      }
      .name {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.25em;
      }
      .mode {
        display: inline-block;
        margin-left: 7px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 999px;
        padding: 4px 7px;
        font-size: 6px;
        letter-spacing: 0.13em;
        color: rgba(255, 255, 255, 0.42);
        vertical-align: 2px;
        background: rgba(0, 0, 0, 0.3);
      }
      .ghost {
        position: absolute;
        left: 12px;
        top: 58px;
        z-index: 1;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: -0.08em;
        color: rgba(255, 255, 255, 0.025);
        pointer-events: none;
      }
      .hud {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        z-index: 6;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 13px;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(14px);
        padding: 10px 11px;
      }
      .signal {
        font-size: 6px;
        font-weight: 700;
        letter-spacing: 0.19em;
        color: rgba(255, 255, 255, 0.3);
        margin-bottom: 5px;
      }
      .frame.hot .signal {
        color: rgba(251, 113, 133, 0.82);
      }
      .frame.good .signal {
        color: rgba(110, 231, 183, 0.82);
      }
      .row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }
      .copy {
        font-size: 9px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.83);
        max-width: 82%;
      }
      .riders {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9px;
        padding: 7px 9px;
        text-align: right;
        font:
          700 12px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .riders span {
        display: block;
        margin-top: 4px;
        font: 600 6px/1 system-ui;
        letter-spacing: 0.15em;
        color: rgba(255, 255, 255, 0.25);
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .controls button {
        min-height: 42px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.025);
        color: rgba(255, 255, 255, 0.55);
        font: 700 7px/1.15 system-ui;
        letter-spacing: 0.1em;
      }
      .controls button.active {
        border-color: rgba(244, 63, 94, 0.36);
        background: rgba(244, 63, 94, 0.12);
        color: #fff;
      }
      .hint {
        text-align: center;
        font-size: 7px;
        letter-spacing: 0.09em;
        color: rgba(255, 255, 255, 0.27);
        padding-top: 5px;
      }
      @media (prefers-reduced-motion: reduce) {
        .frame.hot .orb {
          animation: none;
        }
      }
      @media (min-width: 800px) {
        .shell {
          padding-left: 18px;
          padding-right: 18px;
        }
        .frame {
          min-height: 700px;
        }
        .brand {
          font-size: 18px;
        }
        .copy {
          font-size: 11px;
        }
        .name {
          font-size: 14px;
        }
        .ghost {
          font-size: 64px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <div>
          <div class="brand">ONI HUB</div>
          <div class="sub">KEI · CINEMATIC MEET HOST</div>
        </div>
        <div id="statusPill" class="status">
          <span class="dot"></span><span id="status">SYNC</span>
        </div>
      </header>

      <section id="frame" class="frame">
        <div class="orb"></div>
        <div class="hosttag">
          <div class="eyebrow">ONI // MEET HOST</div>
          <div><span class="name">KEI</span><span id="mode" class="mode">STANDBY</span></div>
        </div>
        <div class="ghost">KEI</div>
        <div id="stage"></div>
        <div id="loading">LINKING KEI…</div>
        <div class="hud">
          <div id="signal" class="signal">HOST LINK STANDBY</div>
          <div class="row">
            <div id="copy" class="copy">Kei дараагийн ONI MEET-ийг хүлээж байна.</div>
            <div class="riders">1/20<span>RIDERS</span></div>
          </div>
        </div>
      </section>

      <footer>
        <div class="controls">
          <button data-state="idle" class="active">IDLE</button>
          <button data-state="open">OPEN</button>
          <button data-state="registered">JOINED</button>
          <button data-state="starting">T-1 MIN</button>
          <button data-state="live">LIVE</button>
          <button data-state="access">ACCESS</button>
        </div>
        <div class="hint">Kei iPhone-safe render · local-first runtime · 30 FPS</div>
      </footer>
    </main>

    <script>
      (async function () {
        const RUNTIME_URLS = {
          pixi: [
            "../vendor/live2d/pixi.min.js",
            "https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js",
          ],
          core: [
            "../vendor/live2d/live2dcubismcore.js",
            "https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js",
          ],
          cubism4: [
            "../vendor/live2d/cubism4.min.js",
            "https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js",
          ],
        };
        const MODEL_URLS = [
          "https://raw.githubusercontent.com/zou-hong-run/ai-xiaoyou-web/39fe1a76517416c503a74caf8efb46e477dd95ce/public/model/kei_zh/kei_basic_free.model3.json",
          "https://raw.githubusercontent.com/NathanCavallier/alice_ai/628e96197bbcd02273f9af50d749df17c34c6137/web/public/assets/live2d_models/kei_basic_free/kei_basic_free.model3.json",
        ];
        const STATES = {
          idle: {
            mode: "STANDBY",
            signal: "HOST LINK STANDBY",
            copy: "Kei дараагийн ONI MEET-ийг хүлээж байна.",
            x: 0,
            y: -0.02,
            motion: 0,
            cls: "",
          },
          open: {
            mode: "REGISTRATION OPEN",
            signal: "JOIN WINDOW ACTIVE",
            copy: "Бүртгэл нээлттэй. Crew аккаунтаа баталгаажуулаад нэгдээрэй.",
            x: 0,
            y: -0.04,
            motion: 3,
            cls: "hot",
          },
          registered: {
            mode: "RIDER VERIFIED",
            signal: "IDENTITY VERIFIED",
            copy: "Бүртгэл баталгаажлаа. Kei таны Meet access-ийг хүлээж байна.",
            x: -0.36,
            y: -0.1,
            motion: 1,
            cls: "good",
          },
          starting: {
            mode: "T-1 MIN",
            signal: "FINAL PREP // 1 MIN",
            copy: "1 минут. ONI MEET launch sequence эхэллээ.",
            x: 0.34,
            y: -0.16,
            motion: 3,
            cls: "hot",
          },
          live: {
            mode: "MEET LIVE",
            signal: "LIVE CHANNEL ACTIVE",
            copy: "ONI MEET эхэллээ. Room access-аа шалгаарай.",
            x: 0.48,
            y: -0.14,
            motion: 2,
            cls: "hot",
          },
          access: {
            mode: "ACCESS READY",
            signal: "SECURE CHANNEL UNLOCKED",
            copy: "ROOM ID ба PASSWORD бэлэн боллоо. ONI MEET-д ороход бэлэн.",
            x: 0.62,
            y: -0.2,
            motion: 0,
            cls: "good hot",
          },
        };

        const stage = document.getElementById("stage");
        const frame = document.getElementById("frame");
        const status = document.getElementById("status");
        const statusPill = document.getElementById("statusPill");
        const loading = document.getElementById("loading");
        const copy = document.getElementById("copy");
        const mode = document.getElementById("mode");
        const signal = document.getElementById("signal");
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const mobile = innerWidth < 640;
        let app = null,
          model = null,
          observer = null,
          resizeRaf = 0,
          current = "idle",
          idleTimer = 0;

        function loadScript(urls, ready, label) {
          return new Promise((resolve, reject) => {
            let index = 0;
            const next = () => {
              if (ready()) return resolve();
              if (index >= urls.length) return reject(new Error(label + " runtime unavailable"));
              const script = document.createElement("script");
              let settled = false;
              const timer = setTimeout(() => {
                if (settled) return;
                settled = true;
                script.remove();
                next();
              }, 9000);
              script.src = urls[index++];
              script.async = false;
              script.onload = () => {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                ready() ? resolve() : next();
              };
              script.onerror = () => {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                script.remove();
                next();
              };
              document.head.appendChild(script);
            };
            next();
          });
        }

        const motionCount = () => {
          try {
            const list = model?.internalModel?.motionManager?.definitions?.[""];
            return Array.isArray(list) ? list.length : 0;
          } catch {
            return 0;
          }
        };
        const safeMotion = (preferred) => {
          if (reduced || !model || typeof model.motion !== "function") return;
          const count = motionCount();
          if (!count) return;
          try {
            model.motion("", Math.abs(preferred || 0) % count, 3);
          } catch {}
        };
        const focus = (x, y, instant = false) => {
          if (!model || typeof model.focus !== "function") return;
          try {
            model.focus(x, y, instant);
          } catch {}
        };

        function apply(state) {
          current = state || "idle";
          const s = STATES[current] || STATES.idle;
          frame.className = "frame " + s.cls;
          mode.textContent = s.mode;
          signal.textContent = s.signal;
          copy.textContent = s.copy;
          document
            .querySelectorAll("[data-state]")
            .forEach((button) =>
              button.classList.toggle("active", button.dataset.state === current),
            );
          focus(s.x, s.y, true);
          if (current !== "idle") safeMotion(s.motion);
        }

        document
          .querySelectorAll("[data-state]")
          .forEach((button) => button.addEventListener("click", () => apply(button.dataset.state)));

        async function loadModel() {
          let last = null;
          for (const url of MODEL_URLS) {
            try {
              return await PIXI.live2d.Live2DModel.from(url, {
                autoInteract: false,
                autoUpdate: true,
              });
            } catch (error) {
              last = error;
              console.warn("Kei source failed", url, error);
            }
          }
          throw last || new Error("Kei unavailable");
        }

        function fit() {
          resizeRaf = 0;
          if (!app || !model) return;
          const w = Math.max(stage.clientWidth, 1);
          const h = Math.max(stage.clientHeight, 1);
          app.renderer.resize(w, h);

          // Kei's reference implementation uses scale 0.6. Do not derive scale
          // from model.width/model.height on iOS Safari: those bounds can be stale
          // before the first Cubism frame and can push the model out of view.
          const viewportFactor = Math.max(0.72, Math.min(1.08, Math.min(w / 720, h / 1000)));
          const scale = 0.6 * viewportFactor;
          model.scale.set(scale);
          model.position.set(w * 0.5, h * (w < 520 ? 0.535 : 0.515));
          model.alpha = 1;
          model.visible = true;
          model.renderable = true;
          try {
            app.renderer.render(app.stage);
          } catch {}
        }
        function queueFit() {
          if (resizeRaf) return;
          resizeRaf = requestAnimationFrame(fit);
        }

        try {
          await loadScript(RUNTIME_URLS.pixi, () => !!window.PIXI?.Application, "Pixi");
          await loadScript(RUNTIME_URLS.core, () => !!window.Live2DCubismCore, "Cubism Core");
          await loadScript(
            RUNTIME_URLS.cubism4,
            () => !!window.PIXI?.live2d?.Live2DModel,
            "Live2D bridge",
          );
          if (typeof PIXI.live2d.Live2DModel.registerTicker === "function") {
            PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);
          }
          if (PIXI.live2d.config) {
            PIXI.live2d.config.sound = false;
            PIXI.live2d.config.motionSync = false;
          }

          app = new PIXI.Application({
            transparent: true,
            antialias: !mobile,
            autoStart: true,
            resolution: Math.min(devicePixelRatio || 1, mobile ? 1 : 1.4),
            autoDensity: true,
            powerPreference: mobile ? "low-power" : "high-performance",
          });
          if (app.ticker) {
            app.ticker.maxFPS = mobile ? 30 : 60;
            app.ticker.minFPS = 20;
          }
          stage.appendChild(app.view);
          app.view.addEventListener("webglcontextlost", (event) => {
            event.preventDefault();
            status.textContent = "RECOVER";
            statusPill.className = "status failed";
          });

          model = await loadModel();
          model.anchor.set(0.5, 0.5);
          app.stage.addChild(model);
          fit();
          requestAnimationFrame(() => {
            fit();
            apply("idle");
          });
          setTimeout(fit, 180);
          setTimeout(fit, 650);
          if ("ResizeObserver" in window) {
            observer = new ResizeObserver(queueFit);
            observer.observe(stage);
          } else {
            addEventListener("resize", queueFit, { passive: true });
          }
          loading.remove();
          status.textContent = "LINKED";
          statusPill.className = "status ready";

          if (!reduced) {
            idleTimer = setInterval(() => {
              if (current === "idle" && !document.hidden)
                focus(Math.sin(Date.now() / 5200) * 0.14, -0.035, false);
            }, 4200);
          }
          document.addEventListener("visibilitychange", () => {
            try {
              if (document.hidden) app.ticker.stop();
              else {
                app.ticker.start();
                queueFit();
              }
            } catch {}
          });
        } catch (error) {
          console.error(error);
          status.textContent = "OFFLINE";
          statusPill.className = "status failed";
          loading.textContent = "KEI VISUAL OFFLINE";
        }

        addEventListener("beforeunload", () => {
          if (resizeRaf) cancelAnimationFrame(resizeRaf);
          if (idleTimer) clearInterval(idleTimer);
          if (observer) observer.disconnect();
          removeEventListener("resize", queueFit);
          try {
            if (model) model.destroy({ children: true, texture: true, baseTexture: true });
          } catch {}
          try {
            if (app) app.destroy(true, { children: true, texture: true, baseTexture: true });
          } catch {}
        });
      })();
    </script>
  </body>
</html>
