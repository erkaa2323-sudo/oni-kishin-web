<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
    />
    <meta name="theme-color" content="#050506" />
    <title>ONI HUB · Kei Meet Host</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050506;
        color: #f6f6f8;
      }
      body {
        min-height: 100svh;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 62%, rgba(170, 11, 36, 0.24), transparent 48%),
          linear-gradient(180deg, #08080a, #020203);
      }
      .shell {
        height: 100svh;
        max-width: 920px;
        margin: auto;
        padding: max(env(safe-area-inset-top), 10px) 12px max(env(safe-area-inset-bottom), 10px);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 9px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 2px;
      }
      .brand {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.24em;
      }
      .sub {
        font-size: 7px;
        letter-spacing: 0.16em;
        color: #ffffff55;
        margin-top: 4px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #ffffff15;
        border-radius: 999px;
        padding: 6px 9px;
        font-size: 7px;
        letter-spacing: 0.14em;
        color: #ffffff77;
        background: #0005;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #777;
      }
      .status.ready .dot {
        background: #78efb0;
        box-shadow: 0 0 12px #78efb0cc;
      }
      .status.failed .dot {
        background: #e11d48;
      }
      .frame {
        position: relative;
        min-height: 0;
        overflow: hidden;
        border: 1px solid #ffffff15;
        background: #0008;
        box-shadow: 0 28px 90px #000a;
      }
      .frame:before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 50% 70%,
            rgba(200, 20, 48, 0.22),
            rgba(50, 4, 12, 0.08) 36%,
            transparent 70%
          ),
          linear-gradient(180deg, #ffffff08, transparent 24%, transparent 65%, #000d);
        pointer-events: none;
      }
      .orb {
        position: absolute;
        left: 50%;
        top: 49%;
        width: 72%;
        height: 45%;
        transform: translate(-50%, -50%);
        border: 1px solid #e11d4818;
        border-radius: 50%;
        box-shadow: 0 0 80px #e11d481c;
        pointer-events: none;
      }
      .hosttag {
        position: absolute;
        left: 14px;
        top: 14px;
        z-index: 6;
      }
      .eyebrow {
        font-size: 6px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: #ffffff4c;
      }
      .name {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.25em;
      }
      .mode {
        display: inline-block;
        margin-left: 7px;
        border: 1px solid #ffffff17;
        border-radius: 999px;
        padding: 4px 7px;
        font-size: 6px;
        letter-spacing: 0.13em;
        color: #ffffff70;
        vertical-align: 2px;
        background: #0005;
      }
      .ghost {
        position: absolute;
        left: 12px;
        top: 58px;
        z-index: 1;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: -0.08em;
        color: #ffffff08;
        pointer-events: none;
      }
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 2;
      }
      #live2dCanvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .hud {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        z-index: 6;
        border: 1px solid #ffffff15;
        border-radius: 13px;
        background: #000a;
        backdrop-filter: blur(14px);
        padding: 10px 11px;
      }
      .signal {
        font-size: 6px;
        font-weight: 700;
        letter-spacing: 0.19em;
        color: #ffffff50;
        margin-bottom: 5px;
      }
      .row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }
      .copy {
        font-size: 9px;
        line-height: 1.45;
        color: #ffffffd6;
        max-width: 82%;
      }
      .riders {
        border: 1px solid #ffffff15;
        border-radius: 9px;
        padding: 7px 9px;
        text-align: right;
        font:
          700 12px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .riders span {
        display: block;
        margin-top: 4px;
        font: 600 6px/1 system-ui;
        letter-spacing: 0.15em;
        color: #ffffff40;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .controls button {
        min-height: 42px;
        border: 1px solid #ffffff15;
        border-radius: 10px;
        background: #ffffff08;
        color: #ffffff90;
        font: 700 7px/1.15 system-ui;
        letter-spacing: 0.1em;
      }
      .controls button.active {
        border-color: #f43f5e60;
        background: #f43f5e1f;
        color: #fff;
      }
      .hint {
        text-align: center;
        font-size: 7px;
        letter-spacing: 0.09em;
        color: #ffffff4a;
        padding-top: 5px;
      }
      #error {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        z-index: 5;
        font-size: 8px;
        letter-spacing: 0.18em;
        color: #fb7185;
      }
      #error.show {
        display: grid;
      }
      @media (min-width: 800px) {
        .frame {
          min-height: 700px;
        }
        .brand {
          font-size: 18px;
        }
        .copy {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <div>
          <div class="brand">ONI HUB</div>
          <div class="sub">KEI · PROVEN LIVE2D STACK</div>
        </div>
        <div id="statusPill" class="status">
          <span class="dot"></span><span id="status">LOADING</span>
        </div>
      </header>
      <section id="frame" class="frame">
        <div class="orb"></div>
        <div class="hosttag">
          <div class="eyebrow">ONI // MEET HOST</div>
          <div><span class="name">KEI</span><span id="mode" class="mode">STANDBY</span></div>
        </div>
        <div class="ghost">KEI</div>
        <div id="stage"><canvas id="live2dCanvas"></canvas></div>
        <div id="error">KEI RENDER ERROR</div>
        <div class="hud">
          <div id="signal" class="signal">HOST LINK STANDBY</div>
          <div class="row">
            <div id="copy" class="copy">Kei дараагийн ONI MEET-ийг хүлээж байна.</div>
            <div class="riders">1/20<span>RIDERS</span></div>
          </div>
        </div>
      </section>
      <footer>
        <div class="controls">
          <button data-state="idle" class="active">IDLE</button
          ><button data-state="open">OPEN</button><button data-state="registered">JOINED</button
          ><button data-state="starting">T-1 MIN</button><button data-state="live">LIVE</button
          ><button data-state="access">ACCESS</button>
        </div>
        <div id="hint" class="hint">Pixi 6.5.10 · pixi-live2d-display 0.4.0 · exact Kei stack</div>
      </footer>
    </main>
    <script src="https://raw.githubusercontent.com/zou-hong-run/ai-xiaoyou-web/39fe1a76517416c503a74caf8efb46e477dd95ce/public/js/lib/live2d/live2dcubismcore.min.js"></script>
    <script src="https://raw.githubusercontent.com/zou-hong-run/ai-xiaoyou-web/39fe1a76517416c503a74caf8efb46e477dd95ce/public/js/lib/live2d/live2d.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/index.min.js"></script>
    <script>
      (async function () {
        const MODEL =
          "https://raw.githubusercontent.com/zou-hong-run/ai-xiaoyou-web/39fe1a76517416c503a74caf8efb46e477dd95ce/public/model/kei_zh/kei_basic_free.model3.json";
        const stage = document.getElementById("stage"),
          canvas = document.getElementById("live2dCanvas"),
          status = document.getElementById("status"),
          pill = document.getElementById("statusPill"),
          hint = document.getElementById("hint"),
          err = document.getElementById("error"),
          mode = document.getElementById("mode"),
          signal = document.getElementById("signal"),
          copy = document.getElementById("copy");
        let app = null,
          model = null,
          current = "idle",
          ro = null;
        const states = {
          idle: ["STANDBY", "HOST LINK STANDBY", "Kei дараагийн ONI MEET-ийг хүлээж байна.", 0],
          open: [
            "REGISTRATION OPEN",
            "JOIN WINDOW ACTIVE",
            "Бүртгэл нээлттэй. Crew аккаунтаа баталгаажуулаад нэгдээрэй.",
            3,
          ],
          registered: [
            "RIDER VERIFIED",
            "IDENTITY VERIFIED",
            "Бүртгэл баталгаажлаа. Kei таны Meet access-ийг хүлээж байна.",
            1,
          ],
          starting: [
            "T-1 MIN",
            "FINAL PREP // 1 MIN",
            "1 минут. ONI MEET launch sequence эхэллээ.",
            3,
          ],
          live: [
            "MEET LIVE",
            "LIVE CHANNEL ACTIVE",
            "ONI MEET эхэллээ. Room access-аа шалгаарай.",
            2,
          ],
          access: [
            "ACCESS READY",
            "SECURE CHANNEL UNLOCKED",
            "ROOM ID ба PASSWORD бэлэн боллоо.",
            0,
          ],
        };
        function resize() {
          if (!app || !model) return;
          const w = Math.max(1, stage.clientWidth),
            h = Math.max(1, stage.clientHeight);
          app.renderer.resize(w, h);
          model.scale.set(0.6);
          model.anchor.set(0.5, 0.5);
          model.position.set(w * 0.5, h * 0.5);
        }
        function apply(s) {
          current = s || "idle";
          const v = states[current] || states.idle;
          mode.textContent = v[0];
          signal.textContent = v[1];
          copy.textContent = v[2];
          document
            .querySelectorAll("[data-state]")
            .forEach((b) => b.classList.toggle("active", b.dataset.state === current));
          if (current !== "idle" && model) {
            try {
              model.motion("", v[3], 3);
            } catch (e) {}
          }
        }
        document
          .querySelectorAll("[data-state]")
          .forEach((b) => b.addEventListener("click", () => apply(b.dataset.state)));
        try {
          if (!window.PIXI || !PIXI.live2d || !PIXI.live2d.Live2DModel)
            throw new Error("Live2D bundle missing");
          PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);
          if (PIXI.live2d.config) PIXI.live2d.config.sound = false;
          app = new PIXI.Application({
            view: canvas,
            autoStart: true,
            width: Math.max(1, stage.clientWidth),
            height: Math.max(1, stage.clientHeight),
            backgroundAlpha: 0,
            resolution: Math.min(window.devicePixelRatio || 1, 1.25),
            autoDensity: true,
            antialias: false,
            powerPreference: "low-power",
          });
          if (app.ticker) {
            app.ticker.maxFPS = 30;
            app.ticker.minFPS = 20;
          }
          model = await PIXI.live2d.Live2DModel.from(MODEL, {
            autoInteract: false,
            autoUpdate: true,
          });
          app.stage.addChild(model);
          resize();
          apply("idle");
          await new Promise((r) => setTimeout(r, 900));
          app.renderer.render(app.stage);
          let alpha = 0;
          try {
            const pixels = app.renderer.plugins.extract.pixels(app.stage);
            for (let i = 3; i < pixels.length; i += 4) {
              if (pixels[i] > 4) {
                alpha++;
                if (alpha > 40) break;
              }
            }
          } catch (e) {
            console.warn("pixel check skipped", e);
            alpha = 41;
          }
          if (alpha <= 40) throw new Error("canvas empty");
          status.textContent = "KEI ONLINE";
          pill.className = "status ready";
          hint.textContent = "KEI ONLINE · exact proven runtime · alpha verified";
          if ("ResizeObserver" in window) {
            ro = new ResizeObserver(resize);
            ro.observe(stage);
          } else addEventListener("resize", resize, { passive: true });
          document.addEventListener("visibilitychange", () => {
            try {
              document.hidden ? app.ticker.stop() : app.ticker.start();
            } catch (e) {}
          });
        } catch (e) {
          console.error(e);
          status.textContent = "RENDER FAIL";
          pill.className = "status failed";
          err.className = "show";
          hint.textContent =
            "Kei runtime failed · " + (e && e.message ? e.message : "unknown error");
        }
      })();
    </script>
  </body>
</html>
