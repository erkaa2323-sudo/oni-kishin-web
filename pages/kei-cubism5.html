<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#050506" />
<title>ONI HUB · Kei Cubism 5 Meet Host</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#050506;color:#f6f6f8}body{min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 62%,rgba(170,11,36,.25),transparent 48%),linear-gradient(180deg,#08080a,#020203)}.shell{min-height:100svh;max-width:920px;margin:auto;padding:max(env(safe-area-inset-top),10px) 12px max(env(safe-area-inset-bottom),10px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:9px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px}.brand{font-size:14px;font-weight:800;letter-spacing:.24em}.sub{font-size:7px;letter-spacing:.16em;color:rgba(255,255,255,.34);margin-top:4px}.status{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:6px 9px;font-size:7px;letter-spacing:.14em;color:rgba(255,255,255,.46);background:rgba(0,0,0,.3)}.dot{width:6px;height:6px;border-radius:50%;background:#777}.status.ready .dot{background:#78efb0;box-shadow:0 0 12px rgba(120,239,176,.8)}.status.failed .dot{background:#e11d48}.frame{position:relative;min-height:0;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.52);box-shadow:0 28px 90px rgba(0,0,0,.62)}.frame:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,rgba(200,20,48,.21),rgba(50,4,12,.08) 36%,transparent 70%),linear-gradient(180deg,rgba(255,255,255,.02),transparent 24%,transparent 65%,rgba(0,0,0,.82));pointer-events:none}.orb{position:absolute;left:50%;top:49%;width:72%;height:45%;transform:translate(-50%,-50%);border:1px solid rgba(225,29,72,.09);border-radius:50%;box-shadow:0 0 80px rgba(225,29,72,.11);opacity:0;transition:opacity .45s ease;pointer-events:none}.frame.hot .orb{opacity:1;animation:pulse 1.6s ease-in-out infinite}.frame.good .orb{opacity:1;border-color:rgba(110,231,183,.1);box-shadow:0 0 80px rgba(110,231,183,.09)}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.035);opacity:.58}}#stage{position:absolute;inset:0;overflow:hidden}#stage canvas{display:block;width:100%;height:100%}#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:8px;letter-spacing:.22em;color:rgba(255,255,255,.27);pointer-events:none}.hosttag{position:absolute;left:14px;top:14px;z-index:6}.eyebrow{font-size:6px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.3)}.name{margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.25em}.mode{display:inline-block;margin-left:7px;border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:4px 7px;font-size:6px;letter-spacing:.13em;color:rgba(255,255,255,.44);vertical-align:2px;background:rgba(0,0,0,.3)}.ghost{position:absolute;left:12px;top:58px;z-index:1;font-size:42px;font-weight:900;letter-spacing:-.08em;color:rgba(255,255,255,.026);pointer-events:none}.hud{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:rgba(0,0,0,.6);backdrop-filter:blur(14px);padding:10px 11px}.signal{font-size:6px;font-weight:700;letter-spacing:.19em;color:rgba(255,255,255,.32);margin-bottom:5px}.frame.hot .signal{color:rgba(251,113,133,.84)}.frame.good .signal{color:rgba(110,231,183,.84)}.row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.copy{font-size:9px;line-height:1.45;color:rgba(255,255,255,.84);max-width:82%}.riders{border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:7px 9px;text-align:right;font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.riders span{display:block;margin-top:4px;font:600 6px/1 system-ui;letter-spacing:.15em;color:rgba(255,255,255,.25)}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.controls button{min-height:42px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.025);color:rgba(255,255,255,.56);font:700 7px/1.15 system-ui;letter-spacing:.1em}.controls button.active{border-color:rgba(244,63,94,.36);background:rgba(244,63,94,.12);color:#fff}.hint{text-align:center;font-size:7px;letter-spacing:.09em;color:rgba(255,255,255,.29);padding-top:5px}@media(prefers-reduced-motion:reduce){.frame.hot .orb{animation:none}}@media(min-width:800px){.frame{min-height:700px}.brand{font-size:18px}.copy{font-size:11px}.name{font-size:14px}.ghost{font-size:64px}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div><div class="brand">ONI HUB</div><div class="sub">KEI · CUBISM 5 MEET HOST</div></div><div id="statusPill" class="status"><span class="dot"></span><span id="status">SYNC</span></div></header>
<section id="frame" class="frame"><div class="orb"></div><div class="hosttag"><div class="eyebrow">ONI // MEET HOST</div><div><span class="name">KEI</span><span id="mode" class="mode">STANDBY</span></div></div><div class="ghost">KEI</div><div id="stage"></div><div id="loading">CUBISM 5 // LOADING KEI</div><div class="hud"><div id="signal" class="signal">HOST LINK STANDBY</div><div class="row"><div id="copy" class="copy">Kei дараагийн ONI MEET-ийг хүлээж байна.</div><div class="riders">1/20<span>RIDERS</span></div></div></div></section>
<footer><div class="controls"><button data-state="idle" class="active">IDLE</button><button data-state="open">OPEN</button><button data-state="registered">JOINED</button><button data-state="starting">T-1 MIN</button><button data-state="live">LIVE</button><button data-state="access">ACCESS</button></div><div class="hint">Cubism 5 renderer · PixiJS 8 · iPhone Safari</div></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.13.1/dist/pixi.min.js"></script>
<script src="../vendor/live2d/live2dcubismcore.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pixi/sound@6.0.1/dist/pixi-sound.js"></script>
<script src="https://cdn.jsdelivr.net/npm/untitled-pixi-live2d-engine@1.3.5/dist/cubism.min.js"></script>
<script>
(async function(){
const MODEL_URLS=["https://raw.githubusercontent.com/zou-hong-run/ai-xiaoyou-web/39fe1a76517416c503a74caf8efb46e477dd95ce/public/model/kei_zh/kei_basic_free.model3.json","https://raw.githubusercontent.com/NathanCavallier/alice_ai/628e96197bbcd02273f9af50d749df17c34c6137/web/public/assets/live2d_models/kei_basic_free/kei_basic_free.model3.json"];
const STATES={idle:{mode:"STANDBY",signal:"HOST LINK STANDBY",copy:"Kei дараагийн ONI MEET-ийг хүлээж байна.",x:0,y:-.02,motion:0,cls:""},open:{mode:"REGISTRATION OPEN",signal:"JOIN WINDOW ACTIVE",copy:"Бүртгэл нээлттэй. Crew аккаунтаа баталгаажуулаад нэгдээрэй.",x:0,y:-.04,motion:3,cls:"hot"},registered:{mode:"RIDER VERIFIED",signal:"IDENTITY VERIFIED",copy:"Бүртгэл баталгаажлаа. Kei таны Meet access-ийг хүлээж байна.",x:-.36,y:-.1,motion:1,cls:"good"},starting:{mode:"T-1 MIN",signal:"FINAL PREP // 1 MIN",copy:"1 минут. ONI MEET launch sequence эхэллээ.",x:.34,y:-.16,motion:3,cls:"hot"},live:{mode:"MEET LIVE",signal:"LIVE CHANNEL ACTIVE",copy:"ONI MEET эхэллээ. Room access-аа шалгаарай.",x:.48,y:-.14,motion:2,cls:"hot"},access:{mode:"ACCESS READY",signal:"SECURE CHANNEL UNLOCKED",copy:"ROOM ID ба PASSWORD бэлэн боллоо. ONI MEET-д ороход бэлэн.",x:.62,y:-.2,motion:0,cls:"good hot"}};
const stage=document.getElementById("stage"),frame=document.getElementById("frame"),status=document.getElementById("status"),statusPill=document.getElementById("statusPill"),loading=document.getElementById("loading"),copy=document.getElementById("copy"),mode=document.getElementById("mode"),signal=document.getElementById("signal");
let app=null,model=null,current="idle",observer=null,raf=0;const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
function fail(message,error){console.error(error||message);status.textContent=message;statusPill.className="status failed";loading.textContent="KEI RENDER ERROR";}
function focus(x,y){try{if(model&&typeof model.focus==="function")model.focus(x,y,true)}catch{}}
function motion(index){if(reduced||!model||typeof model.motion!=="function")return;try{model.motion("",index)}catch{}}
function apply(state){current=state||"idle";const s=STATES[current]||STATES.idle;frame.className="frame "+s.cls;mode.textContent=s.mode;signal.textContent=s.signal;copy.textContent=s.copy;document.querySelectorAll("[data-state]").forEach(b=>b.classList.toggle("active",b.dataset.state===current));focus(s.x,s.y);if(current!=="idle")motion(s.motion)}
document.querySelectorAll("[data-state]").forEach(b=>b.addEventListener("click",()=>apply(b.dataset.state)));
function fit(){raf=0;if(!app||!model)return;const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);app.renderer.resize(w,h);model.scale.set(1);let bw=Number(model.width)||0,bh=Number(model.height)||0;let scale=.5;if(bw>1&&bh>1){scale=Math.min((w*.82)/bw,(h*.84)/bh)}if(!Number.isFinite(scale)||scale<=0)scale=.5;model.scale.set(scale);model.position.set(w*.5,h*.52)}
function queueFit(){if(!raf)raf=requestAnimationFrame(fit)}
async function loadModel(){let last=null;for(const url of MODEL_URLS){try{return await PIXI.live2d.Live2DModel.from(url)}catch(error){last=error;console.warn("Kei source failed",url,error)}}throw last||new Error("Kei model unavailable")}
try{
if(!window.PIXI)throw new Error("PixiJS 8 missing");if(!window.Live2DCubismCore)throw new Error("Cubism 5 Core missing");if(!PIXI.live2d?.Live2DModel||!PIXI.live2d?.Live2DPlugin)throw new Error("Cubism 5 Live2D engine missing");
PIXI.extensions.add(PIXI.live2d.Live2DPlugin);if(typeof PIXI.live2d.Live2DModel.registerTicker==="function")PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);
app=new PIXI.Application();await app.init({width:Math.max(1,stage.clientWidth),height:Math.max(1,stage.clientHeight),backgroundAlpha:0,antialias:false,autoDensity:true,resolution:Math.min(devicePixelRatio||1,1.25),preference:"webgl",powerPreference:"low-power"});if(app.ticker)app.ticker.maxFPS=30;stage.appendChild(app.canvas);
model=await loadModel();model.anchor.set(.5,.5);app.stage.addChild(model);fit();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));fit();
let bounds=null;try{bounds=model.getBounds()}catch{}const visible=!!bounds&&Number(bounds.width)>20&&Number(bounds.height)>20;if(!visible)throw new Error("Kei drawable bounds are empty");
loading.remove();status.textContent="KEI VISIBLE";statusPill.className="status ready";apply("idle");
if("ResizeObserver" in window){observer=new ResizeObserver(queueFit);observer.observe(stage)}else addEventListener("resize",queueFit,{passive:true});document.addEventListener("visibilitychange",()=>{try{if(document.hidden)app.ticker.stop();else{app.ticker.start();queueFit()}}catch{}});
}catch(error){fail("RENDER FAIL",error)}
addEventListener("beforeunload",()=>{if(raf)cancelAnimationFrame(raf);if(observer)observer.disconnect();try{model?.destroy?.({children:true})}catch{}try{app?.destroy?.(true)}catch{}})
})();
</script>
</body>
</html>
