<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <style>
      html,
      body,
      #stage {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        touch-action: pan-y;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: pan-y;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font: 600 8px/1.2 system-ui;
        letter-spacing: 0.22em;
        color: rgba(255, 255, 255, 0.26);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="loading">KEI // CUBISM 5</div>
    <script>
      (async function () {
        const SOURCE = "oni-kei-meet",
          PARENT = "oni-kei-meet-parent";
        const stage = document.getElementById("stage"),
          loading = document.getElementById("loading");
        const modelUrls = [
          "/vendor/live2d/kei/kei_basic_free.model3.json",
          "https://raw.githubusercontent.com/zou-hong-run/ai-xiaoyou-web/39fe1a76517416c503a74caf8efb46e477dd95ce/public/model/kei_zh/kei_basic_free.model3.json",
        ];
        let app = null,
          model = null,
          observer = null,
          raf = 0,
          idleTimer = 0,
          currentState = "idle",
          disposed = false;
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let runtimeType = "loading",
          runtimeDetail;
        function send(type, detail) {
          if (type === "ready" || type === "failed") {
            runtimeType = type;
            runtimeDetail = detail;
          }
          try {
            parent.postMessage({ source: SOURCE, type, detail }, "*");
          } catch {}
        }
        function loadScript(urls, ready, label) {
          return new Promise((resolve, reject) => {
            let i = 0;
            const next = () => {
              if (ready()) return resolve();
              if (i >= urls.length) return reject(new Error(label + " unavailable"));
              const s = document.createElement("script");
              let done = false;
              const timer = setTimeout(() => {
                if (done) return;
                done = true;
                s.remove();
                next();
              }, 7000);
              s.src = urls[i++];
              s.onload = () => {
                if (done) return;
                done = true;
                clearTimeout(timer);
                ready() ? resolve() : next();
              };
              s.onerror = () => {
                if (done) return;
                done = true;
                clearTimeout(timer);
                s.remove();
                next();
              };
              document.head.appendChild(s);
            };
            next();
          });
        }
        function focus(x, y) {
          try {
            model?.focus?.(x, y, true);
          } catch {}
        }
        function motion(index) {
          if (reduced || !model?.motion) return;
          try {
            model.motion("", index);
          } catch {}
        }
        function apply(state, force = false) {
          if (!force && state === currentState && state !== "countdown-final10") return;
          currentState = state || "idle";
          if (!model) return;
          if (currentState === "countdown-ten") {
            focus(0.08, -0.08);
            motion(1);
            return;
          }
          if (currentState === "countdown-five") {
            focus(0.2, -0.12);
            motion(2);
            return;
          }
          if (currentState === "countdown-one") {
            focus(0.34, -0.16);
            motion(3);
            return;
          }
          if (currentState === "countdown-final10") {
            focus(0.48, -0.2);
            return;
          }
          if (currentState === "countdown-go" || currentState === "access") {
            focus(0.62, -0.2);
            motion(0);
            return;
          }
          if (currentState === "registered") {
            focus(-0.36, -0.1);
            motion(1);
            return;
          }
          if (currentState === "live") {
            focus(0.48, -0.14);
            motion(2);
            return;
          }
          if (currentState === "starting" || currentState === "open") {
            focus(0.12, -0.08);
            motion(3);
            return;
          }
          if (currentState === "denied" || currentState === "full" || currentState === "closed") {
            focus(-0.34, 0.18);
            return;
          }
          focus(0, -0.02);
        }
        function frameKei() {
          raf = 0;
          if (!app || !model || disposed) return;
          const w = Math.max(1, stage.clientWidth),
            h = Math.max(1, stage.clientHeight),
            compact = w < 700;
          app.renderer.resize(w, h);
          model.anchor.set(0.5, 0.5);

          const currentScaleX = Math.max(Math.abs(model.scale.x || 1), 0.0001),
            currentScaleY = Math.max(Math.abs(model.scale.y || 1), 0.0001),
            baseW = Math.max(model.width / currentScaleX, 1),
            baseH = Math.max(model.height / currentScaleY, 1),
            fitW = w * 0.92,
            fitH = h * 0.94,
            scale = Math.min(fitW / baseW, fitH / baseH),
            centerY = h * 0.515,
            topSafe = Math.max(0, centerY - fitH * 0.5),
            bottomSafe = Math.max(0, h - (centerY + fitH * 0.5));

          model.scale.set(scale);
          model.position.set(w * 0.5, centerY);
          model.visible = true;
          model.renderable = true;
          model.alpha = 1;
          window.__KEIFRAME__ = {
            compact,
            width: w,
            height: h,
            baseW,
            baseH,
            fitW,
            fitH,
            usableW: fitW,
            usableH: fitH,
            topSafe,
            bottomSafe,
            scale,
            centerY,
            resolution: app.renderer.resolution || 1,
          };
        }
        function queueFrame() {
          if (!raf && !disposed) raf = requestAnimationFrame(frameKei);
        }
        async function loadModel() {
          let last = null;
          const options = {
            textureOptions: { preferCreateImageBitmap: false, lod: false },
            autoFocus: false,
            autoHitTest: false,
            autoUpdate: true,
          };
          for (const url of modelUrls) {
            try {
              return await PIXI.live2d.Live2DModel.from(url, options);
            } catch (error) {
              last = error;
              console.warn("[Kei] source failed", url, error);
            }
          }
          throw last || new Error("Kei model unavailable");
        }
        function alphaSamples() {
          try {
            const gl = app?.renderer?.gl;
            if (!gl) return -1;
            const w = app.canvas.width,
              h = app.canvas.height;
            if (!w || !h) return 0;
            const data = new Uint8Array(w * h * 4);
            gl.finish();
            gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, data);
            let count = 0;
            for (let i = 3; i < data.length; i += 64) {
              if (data[i] > 8) count++;
            }
            return count;
          } catch (error) {
            console.warn("[Kei] pixel audit unavailable", error);
            return -1;
          }
        }
        function shimLegacyGpuMetadata(textures) {
          for (const texture of textures || []) {
            const source = texture?.source;
            if (source && !source._gpuData) {
              Object.defineProperty(source, "_gpuData", {
                value: Object.create(null),
                writable: true,
                configurable: true,
              });
            }
            try {
              if (source) source.scaleMode = "linear";
            } catch {}
          }
        }
        function installCubismCoreCompat(m) {
          const core = m?.internalModel?.coreModel;
          const low = core?.getModel?.();
          if (!core || !low) return;
          if (typeof low.getRenderOrders === "function") {
            core.getDrawableRenderOrders = () => low.getRenderOrders();
          }
          console.log("[Kei] Cubism 5-r.5 compatibility bridge installed", {
            hasGetRenderOrders: typeof low.getRenderOrders === "function",
          });
        }
        function cubismPreflight(m) {
          const internal = m?.internalModel;
          const core = internal?.coreModel;
          const low = core?.getModel?.();
          const drawables = low?.drawables;
          const count = core?.getDrawableCount?.();
          const orders = core?.getDrawableRenderOrders?.();
          const renderer = internal?.renderer;
          const clipping = renderer?._clippingManager;
          const diag = {
            count,
            lowDrawableKeys: drawables ? Object.keys(drawables) : [],
            hasLowGetRenderOrders: typeof low?.getRenderOrders === "function",
            renderOrdersType: orders?.constructor?.name || typeof orders,
            renderOrdersLength: orders?.length ?? -1,
            renderOrdersHead: orders ? Array.from(orders.slice?.(0, 8) || []) : [],
            lowRenderOrdersType:
              drawables?.renderOrders?.constructor?.name || typeof drawables?.renderOrders,
            lowRenderOrdersLength: drawables?.renderOrders?.length ?? -1,
            sortedSize: renderer?._sortedDrawableIndexList?.getSize?.() ?? -1,
            usingMasking: core?.isUsingMasking?.() ?? null,
            hasClippingManager: !!clipping,
            clipDrawListSize: clipping?._clippingContextListForDraw?.getSize?.() ?? -1,
            clipMaskListSize: clipping?._clippingContextListForMask?.getSize?.() ?? -1,
          };
          console.log("[Kei] cubism preflight", diag);
          window.__KEICUBISM__ = diag;
          if (!Number.isInteger(count) || count <= 0)
            throw new Error("Cubism preflight: invalid drawableCount " + String(count));
          if (!orders || typeof orders.length !== "number")
            throw new Error("Cubism preflight: drawable renderOrders missing");
          if (orders.length < count)
            throw new Error(
              "Cubism preflight: renderOrders too short " + orders.length + "/" + count,
            );
          return diag;
        }
        window.addEventListener("message", (event) => {
          const d = event.data;
          if (
            event.source !== parent ||
            event.origin !== location.origin ||
            !d ||
            d.source !== PARENT
          )
            return;
          if (d.type === "request-status") {
            if (runtimeType !== "loading") send(runtimeType, runtimeDetail);
            return;
          }
          if (d.type === "state") apply(d.state);
          if (d.type === "interact") {
            focus((Math.random() - 0.5) * 0.7, -0.1);
            motion(Math.floor(Math.random() * 4));
          }
        });
        document.addEventListener("visibilitychange", () => {
          try {
            if (!app?.ticker) return;
            if (document.hidden) app.ticker.stop();
            else {
              app.ticker.start();
              queueFrame();
              apply(currentState, true);
            }
          } catch {}
        });
        try {
          await loadScript(
            [
              "/vendor/live2d/pixi8.min.js",
              "https://cdn.jsdelivr.net/npm/pixi.js@8.13.1/dist/pixi.min.js",
            ],
            () => !!window.PIXI,
            "PixiJS 8",
          );
          await loadScript(
            [
              "/vendor/live2d/live2dcubismcore.js",
              "https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js",
            ],
            () => !!window.Live2DCubismCore,
            "Cubism 5 Core",
          );
          await loadScript(
            [
              "/vendor/live2d/pixi-sound.js",
              "https://cdn.jsdelivr.net/npm/@pixi/sound@6.0.1/dist/pixi-sound.js",
            ],
            () => !!window.PIXI?.sound,
            "Pixi Sound",
          );
          await loadScript(
            [
              "/vendor/live2d/cubism5-engine.min.js",
              "https://cdn.jsdelivr.net/npm/untitled-pixi-live2d-engine@1.3.5/dist/cubism.min.js",
            ],
            () => !!(window.PIXI?.live2d?.Live2DModel && window.PIXI?.live2d?.Live2DPlugin),
            "Cubism 5 engine",
          );
          PIXI.extensions.add(PIXI.live2d.Live2DPlugin);
          if (typeof PIXI.live2d.Live2DModel.registerTicker === "function")
            PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);
          app = new PIXI.Application();
          const dpr = Math.min(Math.max(window.devicePixelRatio || 1, 1), 2);
          await app.init({
            width: Math.max(1, stage.clientWidth),
            height: Math.max(1, stage.clientHeight),
            backgroundAlpha: 0,
            antialias: true,
            autoDensity: true,
            resolution: dpr,
            preference: "webgl",
            powerPreference: "high-performance",
            preserveDrawingBuffer: true,
          });
          if (app.ticker) app.ticker.maxFPS = reduced ? 30 : 60;
          stage.appendChild(app.canvas);
          app.canvas.addEventListener("webglcontextlost", (event) => {
            event.preventDefault();
            send("failed", "webgl-context-lost");
          });
          model = await loadModel();
          shimLegacyGpuMetadata(model?.textures);
          installCubismCoreCompat(model);
          cubismPreflight(model);
          const t0 = model?.textures?.[0];
          if (!t0) throw new Error("Kei model has no texture[0]");
          app.renderer.texture.resetState();
          app.renderer.gl.pixelStorei(
            WebGLRenderingContext.UNPACK_FLIP_Y_WEBGL,
            !!model?.internalModel?.textureFlipY,
          );
          app.renderer.texture.bind(t0, 0);
          window.__KEIDIAG__ = {
            directBindOk: true,
            legacyGpuDataReady: !!t0.source?._gpuData,
            resourceType: t0.source?.resource?.constructor?.name || "",
            pixelWidth: t0.source?.pixelWidth || 0,
            pixelHeight: t0.source?.pixelHeight || 0,
            flipY: !!model?.internalModel?.textureFlipY,
            resolution: dpr,
          };
          app.stage.addChild(model);
          frameKei();
          apply(currentState, true);
          await new Promise((r) =>
            requestAnimationFrame(() => requestAnimationFrame(() => requestAnimationFrame(r))),
          );
          frameKei();
          await new Promise((r) => setTimeout(r, 260));
          app.renderer.render(app.stage);
          const pixels = alphaSamples();
          if (pixels === 0) throw new Error("Canvas alpha is empty after Cubism 5 render");
          loading.remove();
          send("ready", pixels);
          if ("ResizeObserver" in window) {
            observer = new ResizeObserver(queueFrame);
            observer.observe(stage);
          } else addEventListener("resize", queueFrame, { passive: true });
          if (!reduced)
            idleTimer = setInterval(() => {
              if (
                model &&
                !document.hidden &&
                (currentState === "idle" || currentState === "scheduled")
              )
                focus(Math.sin(Date.now() / 5200) * 0.14, -0.035);
            }, 4200);
        } catch (error) {
          console.error("[Kei] render failed", error);
          loading.textContent = "KEI // RENDER ERROR";
          send("failed", String(error?.message || error));
        }
        addEventListener("beforeunload", () => {
          disposed = true;
          if (raf) cancelAnimationFrame(raf);
          if (idleTimer) clearInterval(idleTimer);
          observer?.disconnect();
          try {
            model?.destroy?.({ children: true });
          } catch {}
          try {
            app?.destroy?.(true);
          } catch {}
        });
      })();
    </script>
  </body>
</html>
