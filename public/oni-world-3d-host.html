<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="theme-color" content="#030307" />
    <title>ONI WORLD 3D</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #030307;
        color: #f7f3f4;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #world {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 32%, rgba(104, 8, 27, 0.22), transparent 35%),
          linear-gradient(180deg, #05060c 0%, #020205 100%);
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: 0;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 44%, rgba(148, 11, 40, 0.2), transparent 28%),
          #030307;
        transition:
          opacity 500ms ease,
          visibility 500ms ease;
      }
      .boot[data-ready="true"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-card {
        width: min(420px, 92vw);
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        background: rgba(5, 5, 10, 0.78);
        backdrop-filter: blur(18px);
        clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      }
      .eyebrow {
        margin: 0;
        font-size: 10px;
        letter-spacing: 0.28em;
        color: #ff365f;
      }
      .boot h1 {
        margin: 9px 0 6px;
        font-size: clamp(30px, 8vw, 52px);
        line-height: 0.95;
        letter-spacing: -0.045em;
      }
      .boot p {
        margin: 0;
        color: rgba(255, 255, 255, 0.58);
        font-size: 12px;
        line-height: 1.6;
      }
      .progress {
        height: 2px;
        margin-top: 18px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }
      .progress::after {
        content: "";
        display: block;
        width: 44%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #ff244e, transparent);
        animation: scan 1.25s ease-in-out infinite;
      }
      @keyframes scan {
        from {
          transform: translateX(-120%);
        }
        to {
          transform: translateX(330%);
        }
      }
      .world-hud {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }
      .world-chip {
        position: absolute;
        left: 14px;
        bottom: 14px;
        max-width: min(360px, calc(100vw - 28px));
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(3, 3, 8, 0.58);
        backdrop-filter: blur(14px);
        clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
      }
      .world-chip strong {
        display: block;
        font-size: 11px;
        letter-spacing: 0.16em;
      }
      .world-chip span {
        display: block;
        margin-top: 4px;
        font-size: 10px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.52);
      }
      .quality {
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 7px 9px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(3, 3, 8, 0.52);
        font-size: 9px;
        letter-spacing: 0.16em;
        color: rgba(255, 255, 255, 0.58);
        backdrop-filter: blur(12px);
      }
      .error {
        display: none;
        color: #ff6c88 !important;
      }
      .boot[data-error="true"] .progress {
        display: none;
      }
      .boot[data-error="true"] .error {
        display: block;
        margin-top: 12px;
      }
      @media (prefers-reduced-motion: reduce) {
        .progress::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="world" aria-label="ONI WORLD 3D interactive city"></div>

    <div class="boot" id="boot">
      <div class="boot-card">
        <p class="eyebrow">ONI WORLD // 2099</p>
        <h1>ENTERING WORLD</h1>
        <p>3D city core, district network, lighting болон camera system ачаалж байна.</p>
        <div class="progress"></div>
        <p class="error" id="boot-error">3D engine ачаалж чадсангүй. Холболтоо шалгаад дахин оролдоно уу.</p>
      </div>
    </div>

    <div class="world-hud" aria-hidden="true">
      <div class="quality" id="quality">ADAPTIVE // MOBILE</div>
      <div class="world-chip">
        <strong id="focus-name">ONI MEGACITY</strong>
        <span id="focus-hint">Drag — 360° · Pinch — zoom · District дээр tap — cinematic focus</span>
      </div>
    </div>

    <script type="module">
      const boot = document.getElementById("boot");
      const world = document.getElementById("world");
      const qualityLabel = document.getElementById("quality");
      const focusName = document.getElementById("focus-name");
      const focusHint = document.getElementById("focus-hint");

      const MOBILE = matchMedia("(pointer: coarse)").matches || innerWidth < 900;
      const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const DPR = Math.min(devicePixelRatio || 1, MOBILE ? 1.45 : 1.8);
      const BUILDING_BUDGET = MOBILE ? 54 : 92;
      qualityLabel.textContent = MOBILE ? "ADAPTIVE // MOBILE" : "ADAPTIVE // DESKTOP";

      let worldState = {
        meetActive: false,
        activeRiders: 0,
        machines: 0,
        pulse: 24,
      };

      const ROUTES = {
        hq: "/profile",
        drift: "/meet",
        garage: "/garage",
        archive: "/gallery",
        ai: "/oni-ai",
        arena: "/meet",
        docks: "/garage",
      };

      const DISTRICT_COPY = {
        hq: ["ONI CITADEL", "Crew core · ONI ID · progression"],
        drift: ["KISHIN MOUNTAIN", "Drift road · live Meet district"],
        garage: ["KISHIN GARAGE", "Machine sector · Garage DNA"],
        archive: ["MEMORY ARCHIVE", "Clan gallery · battle memory"],
        ai: ["SHIZUKI AI TOWER", "ONI AI command uplink"],
        arena: ["ONI BATTLE ARENA", "Event core · live competition"],
        docks: ["AKUMA DOCKS", "Industrial machine district"],
      };

      try {
        const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
        const CONTROLS_URL = "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";
        const THREE = await import(THREE_URL);
        const { OrbitControls } = await import(CONTROLS_URL);

        const renderer = new THREE.WebGLRenderer({ antialias: !MOBILE, alpha: false, powerPreference: "high-performance" });
        renderer.setPixelRatio(DPR);
        renderer.setSize(innerWidth, innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = MOBILE ? 0.96 : 1.03;
        renderer.shadowMap.enabled = !MOBILE;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.domElement.setAttribute("aria-label", "ONI WORLD 360 degree city view");
        world.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x03040a);
        scene.fog = new THREE.FogExp2(0x070812, MOBILE ? 0.012 : 0.0095);

        const camera = new THREE.PerspectiveCamera(47, innerWidth / innerHeight, 0.1, 260);
        camera.position.set(35, 30, 42);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.055;
        controls.enablePan = false;
        controls.rotateSpeed = MOBILE ? 0.62 : 0.52;
        controls.zoomSpeed = 0.75;
        controls.minDistance = 20;
        controls.maxDistance = 72;
        controls.minPolarAngle = 0.42;
        controls.maxPolarAngle = 1.34;
        controls.target.set(0, 3.7, 0);

        const hemi = new THREE.HemisphereLight(0x8da8d7, 0x160309, MOBILE ? 1.7 : 1.45);
        scene.add(hemi);

        const moon = new THREE.DirectionalLight(0xb8d2ff, MOBILE ? 2.2 : 2.6);
        moon.position.set(-28, 52, 18);
        moon.castShadow = !MOBILE;
        if (!MOBILE) {
          moon.shadow.mapSize.set(1024, 1024);
          moon.shadow.camera.left = -48;
          moon.shadow.camera.right = 48;
          moon.shadow.camera.top = 48;
          moon.shadow.camera.bottom = -48;
        }
        scene.add(moon);

        const redKey = new THREE.PointLight(0xff163f, 54, 58, 1.75);
        redKey.position.set(0, 16, 2);
        scene.add(redKey);

        const cyanRim = new THREE.PointLight(0x35b6ff, 22, 42, 2);
        cyanRim.position.set(-20, 10, -15);
        scene.add(cyanRim);

        const MAT = {
          black: new THREE.MeshStandardMaterial({ color: 0x080911, metalness: 0.78, roughness: 0.34 }),
          dark: new THREE.MeshStandardMaterial({ color: 0x11131c, metalness: 0.64, roughness: 0.47 }),
          ground: new THREE.MeshStandardMaterial({ color: 0x0b0d12, metalness: 0.25, roughness: 0.82 }),
          road: new THREE.MeshStandardMaterial({ color: 0x111219, metalness: 0.48, roughness: 0.52 }),
          red: new THREE.MeshStandardMaterial({ color: 0x5e0619, emissive: 0xe10c36, emissiveIntensity: 2.4, metalness: 0.48, roughness: 0.28 }),
          cyan: new THREE.MeshStandardMaterial({ color: 0x06344a, emissive: 0x0a8ec7, emissiveIntensity: 1.5, metalness: 0.52, roughness: 0.24 }),
          glass: new THREE.MeshStandardMaterial({ color: 0x0b1724, emissive: 0x07192d, emissiveIntensity: 0.65, metalness: 0.64, roughness: 0.12 }),
          mountain: new THREE.MeshStandardMaterial({ color: 0x10131a, metalness: 0.18, roughness: 0.9 }),
        };

        const districtMeshes = [];
        const animated = [];
        const pulseMaterials = [];
        const driftMaterials = [];

        function tag(group, district) {
          group.traverse((node) => {
            if (node.isMesh) {
              node.userData.district = district;
              districtMeshes.push(node);
            }
          });
          group.userData.district = district;
          return group;
        }

        function box(w, h, d, material, x, y, z, parent = scene) {
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
          mesh.position.set(x, y, z);
          mesh.castShadow = !MOBILE;
          mesh.receiveShadow = true;
          parent.add(mesh);
          return mesh;
        }

        function cylinder(radiusTop, radiusBottom, height, segments, material, x, y, z, parent = scene) {
          const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments), material);
          mesh.position.set(x, y, z);
          mesh.castShadow = !MOBILE;
          mesh.receiveShadow = true;
          parent.add(mesh);
          return mesh;
        }

        function ring(radius, tube, material, x, y, z, rotX = Math.PI / 2, parent = scene) {
          const mesh = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 8, MOBILE ? 48 : 72), material);
          mesh.position.set(x, y, z);
          mesh.rotation.x = rotX;
          mesh.receiveShadow = true;
          parent.add(mesh);
          return mesh;
        }

        function seeded(index) {
          const value = Math.sin(index * 12.9898 + 78.233) * 43758.5453;
          return value - Math.floor(value);
        }

        // Ocean and island foundation
        const water = new THREE.Mesh(
          new THREE.CircleGeometry(145, MOBILE ? 64 : 96),
          new THREE.MeshStandardMaterial({
            color: 0x020816,
            emissive: 0x01050e,
            emissiveIntensity: 0.6,
            metalness: 0.76,
            roughness: 0.26,
          }),
        );
        water.rotation.x = -Math.PI / 2;
        water.position.y = -1.15;
        scene.add(water);
        animated.push({ type: "water", object: water });

        cylinder(34, 38, 2.6, MOBILE ? 48 : 72, MAT.ground, 0, 0, 0);
        cylinder(28, 34, 1.1, MOBILE ? 48 : 72, MAT.dark, 0, 1.25, 0);

        // Elevated orbital highways
        ring(22.2, 1.25, MAT.road, 0, 3.0, 0);
        ring(28.2, 0.72, MAT.road, 0, 1.95, 0);
        const roadGlow = ring(22.2, 0.07, MAT.red, 0, 3.14, 0);
        pulseMaterials.push(roadGlow.material);

        // Central ONI Citadel
        const hq = new THREE.Group();
        hq.position.set(0, 1.9, 0);
        cylinder(5.8, 7.4, 1.1, 8, MAT.black, 0, 0.55, 0, hq);
        cylinder(3.7, 5.0, 10.5, 8, MAT.black, 0, 6.1, 0, hq);
        cylinder(2.5, 3.3, 7.2, 8, MAT.dark, 0, 14.7, 0, hq);
        cylinder(1.15, 2.1, 6.5, 8, MAT.black, 0, 21.5, 0, hq);
        const crown = new THREE.Mesh(new THREE.OctahedronGeometry(2.2, 0), MAT.red);
        crown.scale.set(1.5, 0.8, 0.56);
        crown.position.set(0, 25.5, 0);
        crown.rotation.z = Math.PI / 4;
        hq.add(crown);
        const hornGeo = new THREE.ConeGeometry(0.55, 3.2, 5);
        const leftHorn = new THREE.Mesh(hornGeo, MAT.red);
        leftHorn.position.set(-2.0, 27.2, 0);
        leftHorn.rotation.z = 0.42;
        hq.add(leftHorn);
        const rightHorn = leftHorn.clone();
        rightHorn.position.x = 2.0;
        rightHorn.rotation.z = -0.42;
        hq.add(rightHorn);
        for (let i = 0; i < 7; i++) {
          const balcony = ring(3.8 - i * 0.25, 0.09, i % 2 ? MAT.cyan : MAT.red, 0, 5.6 + i * 2.45, 0, Math.PI / 2, hq);
          pulseMaterials.push(balcony.material);
        }
        scene.add(tag(hq, "hq"));

        // Neon Core skyline, deterministic and mobile-budgeted
        const city = new THREE.Group();
        for (let i = 0; i < BUILDING_BUDGET; i++) {
          const a = seeded(i + 1) * Math.PI * 2;
          const radius = 10.5 + seeded(i + 19) * 18.5;
          if (radius < 13.2 && seeded(i + 44) > 0.28) continue;
          const height = 2.6 + Math.pow(seeded(i + 77), 1.8) * 11;
          const width = 0.8 + seeded(i + 113) * 1.8;
          const material = seeded(i + 144) > 0.83 ? MAT.glass : MAT.dark;
          const b = box(width, height, width * (0.78 + seeded(i + 4) * 0.62), material, Math.cos(a) * radius, height / 2 + 2.0, Math.sin(a) * radius, city);
          b.rotation.y = -a + seeded(i + 8) * 0.55;
          if (i % 5 === 0) {
            const cap = box(width * 0.88, 0.08, width * 0.88, i % 10 === 0 ? MAT.red : MAT.cyan, b.position.x, height + 2.05, b.position.z, city);
            cap.rotation.y = b.rotation.y;
          }
        }
        scene.add(city);

        // KISHIN Mountain / Drift District
        const drift = new THREE.Group();
        drift.position.set(-24, 1.2, -12);
        for (let i = 0; i < 5; i++) {
          const mountain = new THREE.Mesh(new THREE.ConeGeometry(5.5 - i * 0.45, 9 + i * 1.6, 7), MAT.mountain);
          mountain.position.set((i - 2) * 3.0, 4.0 + i * 0.65, (i % 2) * 2.4);
          mountain.rotation.y = seeded(i + 222) * Math.PI;
          drift.add(mountain);
        }
        const driftRoad = ring(8.1, 0.62, MAT.road, 0, 5.6, 0, Math.PI / 2, drift);
        driftRoad.scale.set(1.0, 1.0, 0.72);
        const driftGlow = ring(8.1, 0.07, MAT.red.clone(), 0, 5.74, 0, Math.PI / 2, drift);
        driftGlow.scale.copy(driftRoad.scale);
        driftMaterials.push(driftGlow.material);
        const driftGate = box(6.8, 4.4, 0.55, MAT.black, 0, 3.2, 6.4, drift);
        const driftGateGlow = box(5.5, 0.16, 0.64, MAT.red.clone(), 0, 4.5, 6.35, drift);
        driftMaterials.push(driftGateGlow.material);
        scene.add(tag(drift, "drift"));

        // KISHIN Garage
        const garage = new THREE.Group();
        garage.position.set(19, 1.8, -17);
        box(10.8, 3.2, 7.4, MAT.black, 0, 1.6, 0, garage);
        box(8.8, 0.24, 7.5, MAT.red, 0, 3.34, 0, garage);
        for (let i = -3; i <= 3; i += 2) {
          box(1.4, 1.6, 0.18, MAT.glass, i * 1.12, 1.35, 3.74, garage);
        }
        const garageHalo = ring(6.0, 0.1, MAT.cyan, 0, 4.6, 0, Math.PI / 2, garage);
        garageHalo.rotation.z = 0.1;
        scene.add(tag(garage, "garage"));

        // Akuma Docks
        const docks = new THREE.Group();
        docks.position.set(24, 1.35, 13);
        for (let i = 0; i < 14; i++) {
          const col = i % 5;
          const row = Math.floor(i / 5);
          box(3.2, 1.15, 1.4, i % 4 === 0 ? MAT.red : MAT.dark, (col - 2) * 3.0, 0.6 + (i % 3 === 0 ? 1.15 : 0), (row - 1) * 2.1, docks);
        }
        for (const x of [-6.5, 5.8]) {
          box(0.45, 7.4, 0.45, MAT.dark, x, 3.7, -4.2, docks);
          box(7.0, 0.45, 0.45, MAT.dark, x + (x < 0 ? 3.25 : -3.25), 7.15, -4.2, docks);
        }
        scene.add(tag(docks, "docks"));

        // ONI Arena
        const arena = new THREE.Group();
        arena.position.set(2, 1.4, 27);
        cylinder(7.0, 8.2, 2.4, 32, MAT.black, 0, 1.2, 0, arena);
        ring(6.7, 0.32, MAT.red, 0, 2.6, 0, Math.PI / 2, arena);
        ring(4.7, 0.12, MAT.cyan, 0, 3.0, 0, Math.PI / 2, arena);
        scene.add(tag(arena, "arena"));

        // Memory Archive
        const archive = new THREE.Group();
        archive.position.set(-17, 1.55, 20);
        cylinder(4.4, 5.3, 2.6, 6, MAT.black, 0, 1.3, 0, archive);
        const archiveCrystal = new THREE.Mesh(new THREE.OctahedronGeometry(3.1, 0), MAT.cyan);
        archiveCrystal.position.set(0, 5.5, 0);
        archiveCrystal.scale.y = 1.35;
        archive.add(archiveCrystal);
        animated.push({ type: "spin", object: archiveCrystal, speed: 0.08 });
        scene.add(tag(archive, "archive"));

        // SHIZUKI AI Tower
        const ai = new THREE.Group();
        ai.position.set(23, 1.6, 3);
        cylinder(1.35, 2.6, 14.5, 8, MAT.black, 0, 7.25, 0, ai);
        cylinder(0.55, 1.15, 8.0, 8, MAT.dark, 0, 18.5, 0, ai);
        const aiHalo = ring(3.2, 0.09, MAT.cyan, 0, 14.1, 0, 0, ai);
        const aiHalo2 = ring(2.3, 0.07, MAT.red, 0, 17.1, 0, Math.PI / 2, ai);
        animated.push({ type: "halo", object: aiHalo, speed: 0.24 });
        animated.push({ type: "halo", object: aiHalo2, speed: -0.18 });
        scene.add(tag(ai, "ai"));

        // Floating district beacons
        const beaconGeo = new THREE.OctahedronGeometry(0.34, 0);
        const beaconPoints = [
          [0, 30, 0, "hq"],
          [-24, 16, -12, "drift"],
          [19, 10, -17, "garage"],
          [-17, 12, 20, "archive"],
          [23, 29, 3, "ai"],
          [2, 11, 27, "arena"],
          [24, 10, 13, "docks"],
        ];
        for (const [x, y, z, district] of beaconPoints) {
          const beacon = new THREE.Mesh(beaconGeo, district === "ai" ? MAT.cyan : MAT.red);
          beacon.position.set(x, y, z);
          beacon.userData.district = district;
          districtMeshes.push(beacon);
          scene.add(beacon);
          animated.push({ type: "beacon", object: beacon, baseY: y, speed: 0.9 + seeded(y) * 0.4 });
        }

        // Stars / airborne particles
        const starCount = MOBILE ? 220 : 420;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
          const radius = 45 + seeded(i + 301) * 80;
          const angle = seeded(i + 601) * Math.PI * 2;
          starPositions[i * 3] = Math.cos(angle) * radius;
          starPositions[i * 3 + 1] = 14 + seeded(i + 901) * 75;
          starPositions[i * 3 + 2] = Math.sin(angle) * radius;
        }
        const starsGeo = new THREE.BufferGeometry();
        starsGeo.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
        const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0x7f91bd, size: MOBILE ? 0.12 : 0.1, transparent: true, opacity: 0.7, sizeAttenuation: true }));
        scene.add(stars);

        // Moving traffic lights around the orbital road
        const traffic = [];
        const trafficCount = MOBILE ? 8 : 15;
        for (let i = 0; i < trafficCount; i++) {
          const light = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.14, 0.18), i % 3 ? MAT.red : MAT.cyan);
          scene.add(light);
          traffic.push({ object: light, offset: (i / trafficCount) * Math.PI * 2, radius: i % 4 === 0 ? 28.2 : 22.2, speed: 0.055 + seeded(i + 1000) * 0.045 });
        }

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let pointerStart = null;
        let selectedDistrict = null;
        let flight = null;

        const districtFocus = {
          hq: { target: new THREE.Vector3(0, 11, 0), camera: new THREE.Vector3(17, 18, 21) },
          drift: { target: new THREE.Vector3(-24, 6, -12), camera: new THREE.Vector3(-8, 16, 7) },
          garage: { target: new THREE.Vector3(19, 4, -17), camera: new THREE.Vector3(31, 10, -2) },
          archive: { target: new THREE.Vector3(-17, 6, 20), camera: new THREE.Vector3(-3, 13, 33) },
          ai: { target: new THREE.Vector3(23, 11, 3), camera: new THREE.Vector3(38, 20, 17) },
          arena: { target: new THREE.Vector3(2, 4, 27), camera: new THREE.Vector3(18, 12, 40) },
          docks: { target: new THREE.Vector3(24, 4, 13), camera: new THREE.Vector3(39, 11, 28) },
        };

        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function focusDistrict(district) {
          const preset = districtFocus[district];
          if (!preset) return;
          selectedDistrict = district;
          const [name, hint] = DISTRICT_COPY[district];
          focusName.textContent = name;
          focusHint.textContent = `${hint} · Tap дахин — нээх`;
          parent.postMessage({ type: "oni-world:district", district, route: ROUTES[district], name }, location.origin);

          if (REDUCED_MOTION) {
            camera.position.copy(preset.camera);
            controls.target.copy(preset.target);
            controls.update();
            return;
          }

          flight = {
            start: performance.now(),
            duration: 920,
            fromCamera: camera.position.clone(),
            fromTarget: controls.target.clone(),
            toCamera: preset.camera.clone(),
            toTarget: preset.target.clone(),
          };
        }

        function pickDistrict(event) {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          const hits = raycaster.intersectObjects(districtMeshes, false);
          const district = hits[0]?.object?.userData?.district;
          if (!district) return;

          if (selectedDistrict === district) {
            parent.postMessage({ type: "oni-world:enter", district, route: ROUTES[district] }, location.origin);
            return;
          }
          focusDistrict(district);
        }

        renderer.domElement.addEventListener("pointerdown", (event) => {
          pointerStart = { x: event.clientX, y: event.clientY, t: performance.now() };
        });
        renderer.domElement.addEventListener("pointerup", (event) => {
          if (!pointerStart) return;
          const distance = Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y);
          const elapsed = performance.now() - pointerStart.t;
          pointerStart = null;
          if (distance < 10 && elapsed < 420) pickDistrict(event);
        });

        addEventListener("message", (event) => {
          if (event.origin !== location.origin) return;
          if (event.data?.type === "oni-world:state") {
            worldState = { ...worldState, ...event.data.payload };
          }
          if (event.data?.type === "oni-world:focus" && event.data.district) {
            focusDistrict(event.data.district);
          }
          if (event.data?.type === "oni-world:reset") {
            selectedDistrict = null;
            focusName.textContent = "ONI MEGACITY";
            focusHint.textContent = "Drag — 360° · Pinch — zoom · District дээр tap — cinematic focus";
            flight = {
              start: performance.now(),
              duration: 920,
              fromCamera: camera.position.clone(),
              fromTarget: controls.target.clone(),
              toCamera: new THREE.Vector3(35, 30, 42),
              toTarget: new THREE.Vector3(0, 3.7, 0),
            };
          }
        });

        const clock = new THREE.Clock();
        let elapsed = 0;
        function render(now) {
          requestAnimationFrame(render);
          const dt = Math.min(clock.getDelta(), 0.05);
          elapsed += dt;

          if (flight) {
            const t = Math.min(1, (now - flight.start) / flight.duration);
            const e = easeInOutCubic(t);
            camera.position.lerpVectors(flight.fromCamera, flight.toCamera, e);
            controls.target.lerpVectors(flight.fromTarget, flight.toTarget, e);
            if (t >= 1) flight = null;
          }

          controls.update();

          const pulse = 0.75 + Math.sin(elapsed * 1.8) * 0.24;
          for (const material of pulseMaterials) material.emissiveIntensity = 1.8 + pulse * 1.4;
          for (const material of driftMaterials) {
            material.emissiveIntensity = worldState.meetActive ? 3.4 + Math.sin(elapsed * 5.2) * 0.8 : 1.25 + pulse * 0.5;
          }

          for (const item of animated) {
            if (item.type === "spin") item.object.rotation.y += dt * item.speed;
            if (item.type === "halo") item.object.rotation.y += dt * item.speed;
            if (item.type === "beacon") {
              item.object.rotation.y += dt * 0.7;
              item.object.position.y = item.baseY + Math.sin(elapsed * item.speed) * 0.45;
            }
            if (item.type === "water") item.object.rotation.z = Math.sin(elapsed * 0.07) * 0.004;
          }

          for (const car of traffic) {
            car.offset += dt * car.speed;
            car.object.position.set(Math.cos(car.offset) * car.radius, car.radius > 25 ? 2.72 : 3.77, Math.sin(car.offset) * car.radius);
            car.object.rotation.y = -car.offset;
          }

          redKey.intensity = 44 + (worldState.pulse || 24) * 0.12 + Math.sin(elapsed * 1.2) * 3;
          renderer.render(scene, camera);
        }

        function resize() {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setPixelRatio(Math.min(devicePixelRatio || 1, MOBILE ? 1.45 : 1.8));
          renderer.setSize(innerWidth, innerHeight);
        }
        addEventListener("resize", resize, { passive: true });

        requestAnimationFrame(render);
        requestAnimationFrame(() => {
          boot.dataset.ready = "true";
          parent.postMessage({ type: "oni-world:ready" }, location.origin);
        });
      } catch (error) {
        console.error("ONI WORLD 3D boot failed", error);
        boot.dataset.error = "true";
        parent.postMessage({ type: "oni-world:error", message: String(error) }, location.origin);
      }
    </script>
  </body>
</html>
