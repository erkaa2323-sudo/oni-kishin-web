<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ONI HUB">
  <meta name="description" content="ONI HUB — ONI & KISHIN community PWA.">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" sizes="180x180">
  <title>ONI HUB — ONI & KISHIN</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <a class="skip-link" href="#oniMain">Үндсэн контент руу шилжих</a>
  <div class="oni-shell" id="oniShell">
    <div class="oni-world-ambient" aria-hidden="true">
      <span class="oni-world-layer oni-world-haze"></span>
      <span class="oni-world-layer oni-world-grid"></span>
      <span class="oni-world-layer oni-world-skyline"></span>
      <span class="oni-world-layer oni-world-structures"></span>
      <span class="oni-world-layer oni-world-street"></span>
      <span class="oni-world-layer oni-world-rain"></span>
      <span class="oni-world-layer oni-world-particles"></span>
      <span class="oni-world-layer oni-world-glow"></span>
      <div class="oni-world-route-sign">
        <small>ONI WORLD</small>
        <b id="oniRouteLabel">ONI CITY</b>
      </div>
    </div>
    <header class="oni-topbar" aria-label="ONI HUB top bar">
      <a class="oni-brand" href="#home" aria-label="ONI HUB home">
        <img src="../oni-kishin-logo.jpg" width="40" height="40" alt="ONI &amp; KISHIN logo">
        <span>ONI <b>HUB</b></span>
      </a>
      <button class="oni-btn oni-btn-ghost" type="button" data-install-button>СУУЛГАХ</button>
    </header>

    <div class="oni-banner" id="offlineBanner" role="status" aria-live="polite" hidden>
      Offline горим: зарим боломж түр хязгаарлагдсан байна.
    </div>

    <main class="oni-main" id="oniMain" tabindex="-1">
      <section class="oni-view" id="viewRoot" aria-live="polite" aria-busy="true">
        <div class="oni-stack">
          <article class="oni-card oni-skeleton-card" aria-hidden="true"></article>
          <article class="oni-card oni-skeleton-card" aria-hidden="true"></article>
          <article class="oni-card oni-skeleton-card" aria-hidden="true"></article>
        </div>
      </section>
    </main>

    <nav class="oni-bottom-nav" aria-label="ONI HUB navigation">
      <a class="oni-nav-link is-active" href="#home" data-route="home" aria-current="page"><span>⌂</span><small>НҮҮР</small></a>
      <a class="oni-nav-link" href="#garage" data-route="garage"><span>◈</span><small>ГАРАЖ</small></a>
      <a class="oni-nav-link oni-nav-link-center" href="#music" data-route="music"><span>👹</span><small>ONI AI</small></a>
      <a class="oni-nav-link" href="#meet" data-route="meet"><span>⚡</span><small>MEET</small></a>
      <button class="oni-nav-link oni-nav-more" type="button" data-nav-more data-route="more" aria-expanded="false"><span>☰</span><small>БУСАД</small></button>
    </nav>
  </div>

  <div class="oni-bottom-sheet" id="oniMoreSheet" hidden>
    <div class="oni-bottom-sheet-card">
      <div class="oni-bottom-sheet-head">
        <h2>БУСАД</h2>
        <button class="oni-btn oni-btn-ghost" type="button" data-more-close>ХААХ</button>
      </div>
      <div class="oni-bottom-sheet-body">
        <a href="#members" class="oni-sheet-link" data-more-link>ГИШҮҮД</a>
        <a href="#join" class="oni-sheet-link" data-more-link data-route="join">НЭГДЭХ</a>
        <button type="button" class="oni-sheet-link" data-more-info>КЛАН МЭДЭЭЛЭЛ</button>
        <a href="./admin/index.html" class="oni-sheet-link" data-more-admin hidden>ADMIN</a>
      </div>
    </div>
  </div>

  <div class="oni-modal" id="oniModal" role="dialog" aria-modal="true" aria-labelledby="oniModalTitle" hidden>
    <div class="oni-modal-card">
      <div class="oni-modal-head">
        <h2 id="oniModalTitle">ONI HUB мэдээлэл</h2>
        <button class="oni-btn oni-btn-ghost" type="button" data-modal-close>ХААХ</button>
      </div>
      <div class="oni-modal-body" id="oniModalBody"></div>
    </div>
  </div>

  <div class="oni-toast" id="oniToast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <div class="oni-noscript">JavaScript шаардлагатай. ONI HUB-г ашиглахын тулд JavaScript-ээ асаана уу.</div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
